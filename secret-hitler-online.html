/* ═══════════════ מערכת העיצוב ═══════════════
   אווירת כרזה משנות ה-30: שחור חמים, אדום דיו, פליז ונייר מיושן.
   ═════════════════════════════════════════════ */
:root{
  --ink:#0b0908; --ink2:#151110; --ink3:#211917; --ink4:#2e2320;
  --paper:#e9dcc4; --paper2:#c9b79a;
  --blood:#b3121a; --blood-lt:#e0353b; --blood-dk:#6d0a10;
  --indigo:#2b5f8f; --indigo-lt:#6aa5da; --indigo-dk:#16324c;
  --brass:#c9a227; --brass-lt:#eccd6b; --brass-dk:#7d6415;
  --text:#f0e7d8; --smoke:#9a8b78; --ok:#5fae62;
  --shadow:0 14px 34px #00000075;
  --hair:1px solid #c9a22733;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Assistant','Segoe UI',system-ui,sans-serif;
  background:var(--ink); color:var(--text);
  min-height:100dvh; overflow-x:hidden; position:relative;
}
/* גרעין נייר + ויניית — שכבות אווירה קבועות */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.5;
  background-image:
    radial-gradient(#ffffff0c 1px, transparent 1.2px),
    radial-gradient(#00000020 1px, transparent 1.2px);
  background-size:3px 3px, 5px 5px; background-position:0 0, 2px 1px;
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:2;
  background:radial-gradient(120% 85% at 50% 12%, transparent 38%, #00000090 100%);
}
#root{position:relative; z-index:3}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer}
input{font-family:inherit}

/* ── פריסה ── */
.screen{
  max-width:560px; margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:15px; min-height:100dvh;
}
.screen.center{justify-content:center; text-align:center}
.grow{flex:1}

/* ── טיפוגרפיה ── */
.display{font-family:'Suez One',Georgia,serif; font-weight:400; letter-spacing:-.5px; line-height:1.15}
.eyebrow{
  display:flex; align-items:center; gap:9px;
  font-size:.68rem; font-weight:800; letter-spacing:3px; color:var(--brass);
}
.eyebrow::before,.eyebrow::after{content:''; height:1px; background:linear-gradient(90deg,transparent,var(--brass-dk)); flex:1}
.eyebrow.solo::before{display:none}
.muted{color:var(--smoke)}
.hint{font-size:.82rem; color:var(--smoke); line-height:1.7}

/* קו הפרדה בסגנון דקו */
.rule{display:flex; align-items:center; gap:8px; opacity:.65}
.rule::before,.rule::after{content:''; height:1px; background:var(--brass-dk); flex:1}
.rule i{width:7px; height:7px; background:var(--brass); transform:rotate(45deg); display:block}

/* ── לוחות ── */
.panel{
  background:linear-gradient(180deg,var(--ink2),var(--ink));
  border:var(--hair); border-radius:4px; padding:16px;
  box-shadow:var(--shadow), inset 0 0 0 1px #00000060;
  position:relative;
}
.panel::before{
  content:''; position:absolute; inset:5px; border:1px solid #c9a2271a; pointer-events:none; border-radius:2px;
}
.panel > * { position:relative }
.panel-t{font-family:'Suez One',serif; font-size:1.05rem; margin-bottom:10px; display:flex; align-items:center; gap:8px}
.tag{
  font-size:.7rem; font-weight:800; letter-spacing:1px; color:var(--brass);
  border:1px solid var(--brass-dk); border-radius:2px; padding:2px 8px;
}

/* ── כפתורים ── */
.btn{
  display:block; width:100%; padding:15px 16px; border-radius:3px;
  font-size:1rem; font-weight:800; text-align:center; letter-spacing:.4px;
  background:linear-gradient(180deg,var(--ink3),var(--ink2));
  border:1px solid #c9a22740; color:var(--text);
  box-shadow:0 3px 0 #00000060, inset 0 1px 0 #ffffff10;
  transition:transform .08s, filter .15s;
}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #00000060, inset 0 1px 0 #ffffff10}
.btn:disabled{opacity:.35; pointer-events:none}
.btn--primary{
  background:linear-gradient(180deg,var(--brass-lt),var(--brass));
  color:#231a05; border-color:#00000030; text-shadow:0 1px 0 #ffffff40;
}
.btn--blood{background:linear-gradient(180deg,var(--blood-lt),var(--blood)); color:#fff; border-color:#00000040}
.btn--ghost{background:transparent; border-color:#c9a22733; color:var(--smoke); box-shadow:none; font-weight:600}
.btn--sm{padding:11px 14px; font-size:.88rem}
.btn-row{display:flex; gap:10px}
.btn-row > *{flex:1}
.icon-btn{
  width:40px; height:40px; border-radius:3px; display:grid; place-items:center; font-size:1rem;
  background:var(--ink2); border:1px solid #c9a22733;
}

/* ── סרגל עליון ── */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px}
.topbar h2{font-family:'Suez One',serif; font-size:1.1rem}
.topbar .tools{display:flex; gap:8px}

/* ── הלוח ── */
.board{display:flex; flex-direction:column; gap:9px}
.track{
  border-radius:3px; padding:10px 11px; position:relative; overflow:hidden;
  border:1px solid #00000080;
}
.track.lib{background:linear-gradient(180deg,#173553,#0e1f30)}
.track.fas{
  background:linear-gradient(180deg,#3a1113,#1d0a0b);
}
.track.fas::before{
  content:''; position:absolute; inset:0; opacity:.16; pointer-events:none;
  background-image:radial-gradient(#e0353b 1px, transparent 1.4px); background-size:7px 7px;
}
.track-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; position:relative}
.track-name{font-family:'Suez One',serif; font-size:.82rem; letter-spacing:1px}
.track.lib .track-name{color:#a8cdf0}
.track.fas .track-name{color:#f3b1b1}
.track-count{font-size:.72rem; font-weight:800; color:#ffffff70; font-variant-numeric:tabular-nums}
.slots{display:flex; gap:5px; position:relative}
.slot{
  flex:1; aspect-ratio:.72; border-radius:2px; display:grid; place-items:center;
  font-size:.62rem; font-weight:800; text-align:center; line-height:1.15; padding:2px;
  border:1px dashed #ffffff26; color:#ffffff40; background:#00000040;
}
.slot.on{border:1px solid #00000060; color:#fff; animation:slotFill .5s cubic-bezier(.2,1.4,.4,1) both}
.track.lib .slot.on{background:linear-gradient(165deg,#3f7fc0,#1d4a78); box-shadow:0 3px 12px #2b5f8f70, inset 0 1px 0 #ffffff30}
.track.fas .slot.on{background:linear-gradient(165deg,#cf2027,#7d0f14); box-shadow:0 3px 12px #b3121a70, inset 0 1px 0 #ffffff25}
@keyframes slotFill{0%{transform:scale(.4) rotate(-14deg); opacity:0}60%{transform:scale(1.12) rotate(3deg)}100%{transform:none; opacity:1}}

.tracker{display:flex; align-items:center; gap:9px; justify-content:center; padding:3px 0}
.tracker-lbl{font-size:.7rem; font-weight:800; color:var(--smoke); letter-spacing:.5px}
.dot{width:13px; height:13px; border-radius:50%; border:2px solid #c9a22755; background:#00000050}
.dot.on{background:var(--brass); border-color:var(--brass-lt); box-shadow:0 0 10px #c9a22780}

/* ── שחקנים ── */
.plist{display:flex; flex-wrap:wrap; gap:7px}
.ptag{
  background:linear-gradient(180deg,var(--ink3),var(--ink2));
  border:1px solid #c9a22733; border-radius:2px;
  padding:7px 11px; font-size:.82rem; font-weight:700;
  display:flex; align-items:center; gap:7px;
}
.ptag.dead{opacity:.35; text-decoration:line-through}
.ptag.me{border-color:var(--brass); box-shadow:0 0 0 1px #c9a22740}
.ptag.pres{background:linear-gradient(180deg,#3a2f10,#241c09); border-color:var(--brass)}
.ptag.chan{background:linear-gradient(180deg,#16344f,#0e2135); border-color:#4f8bc4}
.ptag .conn{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:0 0 7px}
.ptag .conn.off{background:var(--blood-lt)}
.ptag .role-badge{font-size:.6rem; font-weight:800; padding:1px 6px; border-radius:2px; background:var(--brass); color:#231a05; letter-spacing:.5px}
.ptag .role-badge.chan{background:#6aa5da; color:#08182a}
.ptag.justkilled{animation:killShake .6s both}
@keyframes killShake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-2deg)}40%{transform:translateX(4px) rotate(2deg)}60%{transform:translateX(-2px)}}

/* ── כרטיס תפקיד ── */
.rolecard{
  border-radius:4px; padding:26px 20px; text-align:center; position:relative; overflow:hidden;
  border:2px solid; box-shadow:var(--shadow);
  animation:flipIn .7s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes flipIn{0%{transform:perspective(700px) rotateY(88deg) scale(.9); opacity:0}100%{transform:none; opacity:1}}
.rolecard.lib{background:linear-gradient(170deg,#1b3f63,#0d2036); border-color:var(--indigo)}
.rolecard.fas{background:linear-gradient(170deg,#4a1315,#210a0b); border-color:var(--blood)}
.rolecard::after{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.13;
  background-image:radial-gradient(#fff 1px, transparent 1.3px); background-size:6px 6px;
}
.rolecard .r-lbl{font-size:.7rem; font-weight:800; letter-spacing:2px; color:#ffffff80}
.rolecard .r-name{font-family:'Suez One',serif; font-size:2.4rem; margin:8px 0 6px}
.rolecard.lib .r-name{color:#a8cdf0}
.rolecard.fas .r-name{color:#f3a2a2}
.rolecard .r-desc{font-size:.87rem; color:#e6dccd; line-height:1.75; margin-top:10px}
.team-box{margin-top:15px; background:#00000055; border:1px solid #ffffff14; border-radius:3px; padding:12px}
.team-box .t-lbl{font-size:.68rem; font-weight:800; color:#ffffff70; letter-spacing:1.5px; margin-bottom:7px}
.team-box .t-names{font-size:.98rem; font-weight:800; line-height:1.8}

/* ── קלפי מדיניות ── */
.pol-row{display:flex; gap:10px; justify-content:center}
.pol{
  flex:1; max-width:150px; aspect-ratio:.7; border-radius:3px; border:2px solid transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  font-weight:800; text-align:center; padding:8px; position:relative; overflow:hidden;
  transition:transform .12s; animation:dealIn .45s cubic-bezier(.2,1.1,.4,1) both;
  box-shadow:0 8px 20px #00000070;
}
.pol:nth-child(2){animation-delay:.08s}
.pol:nth-child(3){animation-delay:.16s}
@keyframes dealIn{0%{transform:translateY(26px) rotate(-8deg); opacity:0}100%{transform:none; opacity:1}}
.pol:active{transform:scale(.96)}
.pol.L{background:linear-gradient(165deg,#3f7fc0,#17395c); color:#fff}
.pol.F{background:linear-gradient(165deg,#cf2027,#6d0a10); color:#fff}
.pol::after{content:''; position:absolute; inset:0; opacity:.15; background-image:radial-gradient(#fff 1px,transparent 1.3px); background-size:6px 6px}
.pol.sel{border-color:var(--brass); box-shadow:0 0 0 3px #c9a22755, 0 8px 20px #00000070}
.pol.dim{opacity:.38}
.pol .p-name{font-family:'Suez One',serif; font-size:1.05rem; position:relative}
.pol .p-ico{font-size:1.8rem; position:relative}
.pol .p-act{font-size:.7rem; font-weight:800; background:#00000045; padding:3px 9px; border-radius:2px; position:relative}

/* ── הצבעה ── */
.vote-row{display:flex; gap:12px}
.vote-btn{
  flex:1; padding:24px 10px; border-radius:3px; font-family:'Suez One',serif; font-size:1.7rem;
  color:#fff; border:2px solid #00000050; position:relative; overflow:hidden;
  box-shadow:0 6px 0 #00000060;
}
.vote-btn small{display:block; font-family:'Assistant',sans-serif; font-size:.72rem; font-weight:800; opacity:.8; letter-spacing:2px}
.vote-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #00000060}
.vote-btn.ja{background:linear-gradient(170deg,#4e8f52,#255c2c)}
.vote-btn.nein{background:linear-gradient(170deg,#c8323a,#7a1116)}
.vote-list{display:flex; flex-direction:column; gap:6px}
.vote-item{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--ink3); border:1px solid #ffffff10; border-radius:2px; padding:10px 13px;
  font-weight:700; font-size:.9rem; animation:rowIn .35s both;
}
.vote-item:nth-child(2){animation-delay:.05s}.vote-item:nth-child(3){animation-delay:.1s}
.vote-item:nth-child(4){animation-delay:.15s}.vote-item:nth-child(5){animation-delay:.2s}
.vote-item:nth-child(6){animation-delay:.25s}.vote-item:nth-child(7){animation-delay:.3s}
.vote-item:nth-child(8){animation-delay:.35s}.vote-item:nth-child(9){animation-delay:.4s}
.vote-item:nth-child(10){animation-delay:.45s}
@keyframes rowIn{0%{opacity:0; transform:translateX(14px)}100%{opacity:1; transform:none}}
.v-ja{color:#7bd67f; font-family:'Suez One',serif}
.v-nein{color:#f08a8a; font-family:'Suez One',serif}
.voted-list{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
.voted-chip{background:var(--ink3); border:1px solid #ffffff12; border-radius:2px; padding:5px 11px; font-size:.76rem; font-weight:700; color:var(--smoke)}
.voted-chip.done{background:#1b3720; border-color:#3f7a45; color:#9fe0a3}

/* ── כרזות ── */
.banner{
  border-radius:3px; padding:19px; text-align:center; position:relative; overflow:hidden;
  font-family:'Suez One',serif; font-size:1.2rem; line-height:1.45;
  animation:bannerIn .5s cubic-bezier(.2,1.2,.4,1) both; box-shadow:var(--shadow);
}
@keyframes bannerIn{0%{transform:scale(.94); opacity:0}100%{transform:none; opacity:1}}
.banner .b-sub{font-family:'Assistant',sans-serif; font-size:.82rem; font-weight:700; opacity:.9; margin-top:8px}
.banner.lib{background:linear-gradient(160deg,#2b5f8f,#12293f); color:#fff; border:1px solid #5b9bd580}
.banner.fas{background:linear-gradient(160deg,#b3121a,#4d080d); color:#fff; border:1px solid #e0353b70}
.banner.neutral{background:linear-gradient(160deg,var(--ink3),var(--ink2)); border:1px solid #c9a22740}
.banner.fas::after,.banner.lib::after{content:''; position:absolute; inset:0; opacity:.12; background-image:radial-gradient(#fff 1px,transparent 1.4px); background-size:7px 7px}

/* ── רשימת בחירה ── */
.sel-list{display:flex; flex-direction:column; gap:8px}
.sel{
  display:flex; justify-content:space-between; align-items:center; width:100%; text-align:right;
  background:linear-gradient(180deg,var(--ink3),var(--ink2)); border:1px solid #c9a22733;
  border-radius:2px; padding:14px 15px; font-size:1rem; font-weight:800;
  box-shadow:0 2px 0 #00000050;
}
.sel:active{transform:translateY(1px)}
.sel.sel--on{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass) inset, 0 2px 0 #00000050}
.sel .why{font-size:.72rem; font-weight:700; color:var(--smoke)}
.sel:disabled{opacity:.34; pointer-events:none}

/* ── קוד חדר ── */
.code-box{
  background:linear-gradient(180deg,#241b0c,#120d06); border:2px solid var(--brass);
  border-radius:4px; padding:20px; text-align:center; box-shadow:var(--shadow);
}
.code-box .c-val{
  font-family:'Suez One',serif; font-size:3.3rem; letter-spacing:14px; color:var(--brass-lt);
  direction:ltr; margin:6px 0; text-shadow:0 3px 0 #00000080;
}
.code-inp{
  width:100%; background:#00000060; border:2px solid #c9a22740; border-radius:3px;
  color:var(--text); font-family:'Suez One',serif; font-size:2rem; letter-spacing:12px;
  direction:ltr; text-align:center; padding:12px; outline:none;
}
.code-inp:focus{border-color:var(--brass)}
.name-inp{
  width:100%; background:#00000060; border:1px solid #c9a22740; border-radius:3px;
  color:var(--text); font-size:1.05rem; font-weight:700; padding:13px; outline:none;
}
.name-inp:focus{border-color:var(--brass)}

/* ── המתנה ── */
.wait{display:flex; flex-direction:column; align-items:center; gap:11px; padding:16px 0; text-align:center}
.wait .w-who{font-family:'Suez One',serif; font-size:1.35rem}
.wait .w-what{font-size:.88rem; color:var(--smoke); line-height:1.6}
.spinner{width:34px; height:34px; border-radius:50%; border:3px solid #c9a22733; border-top-color:var(--brass); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── רצועת תפקיד ── */
.you-are{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  background:linear-gradient(180deg,var(--ink2),var(--ink)); border:1px solid #c9a22733;
  border-radius:2px; padding:11px 13px;
}
.you-are .ya-lbl{font-size:.68rem; font-weight:800; color:var(--brass); letter-spacing:2px}
.you-are .ya-val{font-size:.92rem; font-weight:800}
.you-are .ya-val.lib{color:#a8cdf0}
.you-are .ya-val.fas{color:#f3a2a2}

/* ── תור שלך ── */
.turn{
  border:1px solid var(--brass); background:linear-gradient(180deg,#332809,#1a1405);
  border-radius:3px; padding:11px 14px; text-align:center;
  font-family:'Suez One',serif; font-size:1rem; color:var(--brass-lt);
  animation:turnPulse 2s ease-in-out infinite;
}

<body>
<div id="root"></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   סיקרט היטלר — אונליין. כל שחקן מהטלפון שלו.
   מי שפותח את החדר הוא ה"מארח": המכשיר שלו מנהל את המשחק,
   והשאר מתחברים אליו ישירות (WebRTC) עם קוד בן 4 ספרות.

   מבנה: מנוע חוקים (רץ רק אצל המארח) → בניית "תצוגה" אישית לכל
   שחקן → שכבת React שמציירת אותה ומנגנת אנימציות לפי מה שהשתנה.
   ══════════════════════════════════════════════════════════════ */

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const uid = () => 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
/* ══════════════ חוקי המשחק ══════════════ */

const SETUP = {
  5:  { fascists: 1, hitlerKnows: true  },
  6:  { fascists: 1, hitlerKnows: true  },
  7:  { fascists: 2, hitlerKnows: false },
  8:  { fascists: 2, hitlerKnows: false },
  9:  { fascists: 3, hitlerKnows: false },
  10: { fascists: 3, hitlerKnows: false },
};
const POWERS = {
  5:  [null, null, 'peek', 'kill', 'kill'],
  6:  [null, null, 'peek', 'kill', 'kill'],
  7:  [null, 'investigate', 'special', 'kill', 'kill'],
  8:  [null, 'investigate', 'special', 'kill', 'kill'],
  9:  ['investigate', 'investigate', 'special', 'kill', 'kill'],
  10: ['investigate', 'investigate', 'special', 'kill', 'kill'],
};
const POWER_INFO = {
  peek:        { name: 'הצצה במדיניות', icon: '🔮', desc: 'הנשיא מציץ בשלושת הקלפים העליונים בחפיסה.' },
  investigate: { name: 'חקירת נאמנות',  icon: '🔍', desc: 'הנשיא בוחר שחקן ורואה את השתייכותו המפלגתית.' },
  special:     { name: 'בחירות מיוחדות', icon: '🗳️', desc: 'הנשיא בוחר מי יהיה הנשיא בסבב הבא (חד־פעמי).' },
  kill:        { name: 'הוצאה להורג',   icon: '💀', desc: 'הנשיא בוחר שחקן שיוצא מהמשחק.' },
};

/* ══════════════ המנוע — רץ רק אצל המארח ══════════════ */

function glog(G, text) { G.log.push({ r: G.round, text }); if (G.log.length > 120) G.log.shift(); }
const iOf = (G, pid) => G.players.findIndex(p => p.id === pid);
const nameOf = (G, i) => (i == null || i < 0 ? '—' : G.players[i].name);
const aliveCount = G => G.players.filter(p => p.alive).length;

function createGame(players, hostId) {
  const n = players.length;
  const conf = SETUP[n];
  const roles = [];
  for (let i = 0; i < conf.fascists; i++) roles.push('fascist');
  roles.push('hitler');
  while (roles.length < n) roles.push('liberal');
  shuffle(roles);

  const G = {
    hostId,
    boardSize: n,
    hitlerKnows: conf.hitlerKnows,
    players: players.map((p, i) => ({ id: p.id, name: p.name, role: roles[i], alive: true, connected: true })),
    deck: shuffle(Array(6).fill('L').concat(Array(11).fill('F'))),
    discard: [],
    lib: 0, fas: 0, tracker: 0, round: 1,
    presIdx: 0, regularIdx: 0, inSpecial: false, pendingSpecial: null,
    chanIdx: null, lastPres: null, lastChan: null,
    ready: {}, votes: {},
    drawn: [], chanCards: [],
    veto: false, vetoAsked: false,
    investigated: [], powerKind: null, powerStage: null, powerTarget: null,
    winner: null, winReason: '',
    log: [], phase: 'roles',
  };
  glog(G, 'המשחק התחיל — ' + n + ' שחקנים: ' + conf.fascists + ' פשיסטים והיטלר מול ' + (n - conf.fascists - 1) + ' ליברלים');
  return G;
}

function nextAliveAfter(G, i) {
  let j = i;
  for (let k = 0; k < G.players.length; k++) {
    j = (j + 1) % G.players.length;
    if (G.players[j].alive) return j;
  }
  return i;
}

function eligibleChancellor(G, i) {
  if (i == null || i < 0 || i >= G.players.length) return false;
  if (i === G.presIdx || !G.players[i].alive) return false;
  if (i === G.lastChan) return false;
  if (i === G.lastPres && aliveCount(G) > 5) return false;
  return true;
}

function ensureDeck(G, n) {
  if (G.deck.length < n) {
    G.deck = shuffle(G.deck.concat(G.discard));
    G.discard = [];
    glog(G, 'החפיסה נגמרה — הקלפים שהושלכו עורבבו מחדש');
  }
}

function startRound(G) {
  if (G.pendingSpecial !== null) {
    G.presIdx = G.pendingSpecial;
    G.pendingSpecial = null;
    G.inSpecial = true;
    glog(G, 'בחירות מיוחדות: ' + nameOf(G, G.presIdx) + ' מונה לנשיא');
  } else {
    if (G.inSpecial) G.inSpecial = false;
    G.regularIdx = nextAliveAfter(G, G.regularIdx);
    G.presIdx = G.regularIdx;
  }
  G.chanIdx = null;
  G.votes = {};
  G.drawn = []; G.chanCards = [];
  G.vetoAsked = false;
  G.powerKind = null; G.powerStage = null; G.powerTarget = null;
  G.phase = 'nominate';
}

function endGame(G, winner, reason) {
  G.winner = winner;
  G.winReason = reason;
  G.phase = 'gameover';
  glog(G, 'סוף המשחק — ' + (winner === 'liberal' ? 'הליברלים ניצחו' : 'הפשיסטים ניצחו') + ': ' + reason);
}

function enact(G, card, byChaos) {
  if (card === 'L') G.lib++; else G.fas++;
  G.tracker = 0;
  glog(G, 'הועברה מדיניות ' + (card === 'L' ? 'ליברלית' : 'פשיסטית') + ' (ליברלים ' + G.lib + ', פשיסטים ' + G.fas + ')');
  if (!G.veto && G.fas >= 5) { G.veto = true; glog(G, 'כוח הווטו נפתח'); }
  G.lastEnacted = card;
  G.lastByChaos = !!byChaos;

  if (G.lib >= 5) return endGame(G, 'liberal', 'חמש מדיניות ליברליות הועברו');
  if (G.fas >= 6) return endGame(G, 'fascist', 'שש מדיניות פשיסטיות הועברו');

  G.powerKind = (!byChaos && card === 'F') ? (POWERS[G.boardSize][G.fas - 1] || null) : null;
  G.powerStage = G.powerKind ? 'select' : null;
  G.powerTarget = null;
  G.phase = 'enacted';
}

function chaos(G) {
  ensureDeck(G, 1);
  const card = G.deck.shift();
  G.lastPres = null;
  G.lastChan = null;
  glog(G, 'שלוש הצבעות נכשלו ברצף — כאוס! המדיניות העליונה מועברת אוטומטית');
  enact(G, card, true);
}

function resolveVote(G) {
  const voters = G.players.filter(p => p.alive);
  const ja = voters.filter(p => G.votes[p.id] === true).length;
  const passed = ja * 2 > voters.length;
  G.votePassed = passed;
  G.phase = 'voteResult';
  glog(G, passed
    ? 'ההצבעה עברה — ' + nameOf(G, G.presIdx) + ' (נשיא) ו-' + nameOf(G, G.chanIdx) + ' (קנצלר)'
    : 'ההצבעה נכשלה');
}

function afterVoteResult(G) {
  if (G.votePassed) {
    G.lastPres = G.presIdx;
    G.lastChan = G.chanIdx;
    if (G.fas >= 3 && G.players[G.chanIdx].role === 'hitler') {
      return endGame(G, 'fascist', 'היטלר נבחר לקנצלר אחרי שלוש מדיניות פשיסטיות');
    }
    ensureDeck(G, 3);
    G.drawn = [G.deck.shift(), G.deck.shift(), G.deck.shift()];
    G.phase = 'presDraw';
  } else {
    G.tracker++;
    if (G.tracker >= 3) return chaos(G);
    G.round++;
    startRound(G);
  }
}

function afterEnacted(G) {
  if (G.powerKind) {
    if (G.powerKind === 'peek') { ensureDeck(G, 3); G.powerStage = 'result'; }
    G.phase = 'power';
  } else {
    G.round++;
    startRound(G);
  }
}

function usePower(G, target) {
  const k = G.powerKind;
  G.powerTarget = target;
  if (k === 'investigate') {
    G.investigated.push(target);
    glog(G, nameOf(G, G.presIdx) + ' חוקר את נאמנותו של ' + nameOf(G, target));
  } else if (k === 'special') {
    G.pendingSpecial = target;
    glog(G, nameOf(G, G.presIdx) + ' מכריז על בחירות מיוחדות: ' + nameOf(G, target));
  } else if (k === 'kill') {
    G.players[target].alive = false;
    glog(G, nameOf(G, G.presIdx) + ' הוציא להורג את ' + nameOf(G, target));
    if (G.players[target].role === 'hitler') {
      G.powerStage = 'result';
      return endGame(G, 'liberal', 'היטלר הוצא להורג');
    }
  }
  G.powerStage = 'result';
}

function validTarget(G, t) {
  if (t == null || t < 0 || t >= G.players.length) return false;
  if (!G.players[t].alive || t === G.presIdx) return false;
  if (G.powerKind === 'investigate' && G.investigated.includes(t)) return false;
  return true;
}

/* פעולה שהגיעה משחקן. מחזיר true אם המצב השתנה. */
function applyAction(G, pid, act) {
  const i = iOf(G, pid);
  if (i < 0 || !act || typeof act.a !== 'string') return false;
  const isPres = i === G.presIdx;
  const isChan = i === G.chanIdx;

  switch (G.phase) {
    case 'roles':
      if (act.a === 'ready') {
        if (G.ready[pid]) return false;
        G.ready[pid] = true;
        if (G.players.every(p => G.ready[p.id])) {
          G.presIdx = 0; G.regularIdx = 0;
          G.phase = 'nominate';
          glog(G, nameOf(G, 0) + ' פותח כנשיא הראשון');
        }
        return true;
      }
      return false;

    case 'nominate':
      if (act.a === 'nominate' && isPres && eligibleChancellor(G, act.i)) {
        G.chanIdx = act.i;
        G.votes = {};
        G.phase = 'vote';
        glog(G, 'סבב ' + G.round + ': ' + nameOf(G, G.presIdx) + ' מציע את ' + nameOf(G, act.i) + ' לקנצלר');
        return true;
      }
      return false;

    case 'vote': {
      const pending = () => G.players.filter(p => p.alive).every(p => p.id in G.votes);
      if (act.a === 'vote' && G.players[i].alive && !(pid in G.votes)) {
        G.votes[pid] = !!act.v;
        if (pending()) resolveVote(G);
        return true;
      }
      if (act.a === 'skipDisconnected' && pid === G.hostId) {
        let changed = false;
        G.players.forEach(p => {
          if (p.alive && !p.connected && !(p.id in G.votes)) { G.votes[p.id] = false; changed = true; }
        });
        if (changed) {
          glog(G, 'המארח סימן "לא" עבור שחקנים מנותקים');
          if (pending()) resolveVote(G);
        }
        return changed;
      }
      return false;
    }

    case 'voteResult':
      if (act.a === 'continue' && isPres) { afterVoteResult(G); return true; }
      return false;

    case 'presDraw':
      if (act.a === 'discard' && isPres && G.drawn.length === 3 && act.i >= 0 && act.i < 3) {
        G.discard.push(G.drawn[act.i]);
        G.chanCards = G.drawn.filter((_, k) => k !== act.i);
        G.drawn = [];
        G.phase = 'chanDraw';
        return true;
      }
      return false;

    case 'chanDraw':
      if (act.a === 'enact' && isChan && G.chanCards.length === 2 && act.i >= 0 && act.i < 2) {
        const chosen = G.chanCards[act.i];
        G.chanCards.forEach((c, k) => { if (k !== act.i) G.discard.push(c); });
        G.chanCards = [];
        enact(G, chosen, false);
        return true;
      }
      if (act.a === 'veto' && isChan && G.veto && !G.vetoAsked) {
        G.phase = 'vetoAsk';
        glog(G, nameOf(G, G.chanIdx) + ' מבקש וטו');
        return true;
      }
      return false;

    case 'vetoAsk':
      if (act.a === 'vetoYes' && isPres) {
        G.chanCards.forEach(c => G.discard.push(c));
        G.chanCards = [];
        glog(G, 'הווטו אושר — לא הועברה מדיניות');
        G.tracker++;
        if (G.tracker >= 3) chaos(G); else { G.round++; startRound(G); }
        return true;
      }
      if (act.a === 'vetoNo' && isPres) {
        G.vetoAsked = true;
        G.phase = 'chanDraw';
        glog(G, nameOf(G, G.presIdx) + ' דחה את בקשת הווטו');
        return true;
      }
      return false;

    case 'enacted':
      if (act.a === 'continue' && isPres) { afterEnacted(G); return true; }
      return false;

    case 'power':
      if (act.a === 'power' && isPres && G.powerStage === 'select' && validTarget(G, act.i)) {
        usePower(G, act.i);
        return true;
      }
      if (act.a === 'continue' && isPres && G.powerStage === 'result' && G.phase !== 'gameover') {
        G.round++;
        startRound(G);
        return true;
      }
      return false;
  }
  return false;
}

/* ══════════════ מה כל שחקן רואה ══════════════ */

function teamFor(G, i) {
  const me = G.players[i];
  if (me.role === 'liberal') return null;
  if (me.role === 'hitler' && !G.hitlerKnows) return null;
  return G.players
    .map((p, k) => ({ p, k }))
    .filter(o => o.k !== i && (o.p.role === 'fascist' || o.p.role === 'hitler'))
    .map(o => ({ name: o.p.name, hitler: o.p.role === 'hitler' }));
}

function waitingNames(G) {
  if (G.phase === 'roles') return G.players.filter(p => !G.ready[p.id]).map(p => p.name);
  if (G.phase === 'vote') return G.players.filter(p => p.alive && !(p.id in G.votes)).map(p => p.name);
  if (G.phase === 'chanDraw') return [nameOf(G, G.chanIdx)];
  return [nameOf(G, G.presIdx)];
}

function viewFor(G, pid) {
  const i = iOf(G, pid);
  if (i < 0) return null;
  const me = G.players[i];
  const isPres = i === G.presIdx;
  const isChan = i === G.chanIdx;

  const v = {
    phase: G.phase,
    round: G.round,
    boardSize: G.boardSize,
    lib: G.lib, fas: G.fas, tracker: G.tracker,
    deckCount: G.deck.length, discardCount: G.discard.length, vetoOpen: G.veto,
    presName: nameOf(G, G.presIdx),
    chanName: G.chanIdx == null ? null : nameOf(G, G.chanIdx),
    players: G.players.map((p, k) => ({
      name: p.name, alive: p.alive, connected: p.connected,
      pres: k === G.presIdx, chan: k === G.chanIdx, me: k === i,
    })),
    me: { name: me.name, alive: me.alive, role: me.role, team: teamFor(G, i) },
    isHost: pid === G.hostId, isPres, isChan,
    hostName: (G.players.find(p => p.id === G.hostId) || {}).name || '',
    waiting: waitingNames(G),
    log: G.log.slice(-30),
  };

  if (G.phase === 'roles') {
    v.ready = G.ready[pid] === true;
    v.readyCount = G.players.filter(p => G.ready[p.id]).length;
  }

  if (G.phase === 'nominate' && isPres) {
    v.candidates = G.players.map((p, k) => {
      let why = '';
      if (k === G.presIdx) why = 'הנשיא הנוכחי';
      else if (k === G.lastChan) why = 'כיהן כקנצלר בממשלה האחרונה';
      else if (k === G.lastPres && aliveCount(G) > 5) why = 'כיהן כנשיא בממשלה האחרונה';
      return { i: k, name: p.name, why, ok: eligibleChancellor(G, k), alive: p.alive };
    }).filter(c => c.alive);
  }

  if (G.phase === 'vote') {
    v.myVote = pid in G.votes ? G.votes[pid] : null;
    v.voted = G.players.filter(p => p.alive).map(p => ({ name: p.name, done: p.id in G.votes }));
    v.anyDisconnected = G.players.some(p => p.alive && !p.connected && !(p.id in G.votes));
  }

  if (G.phase === 'voteResult') {
    v.passed = G.votePassed;
    v.votes = G.players.filter(p => p.alive).map(p => ({ name: p.name, v: G.votes[p.id] === true }));
    v.chaosNext = !G.votePassed && G.tracker === 2;
  }

  if (G.phase === 'presDraw' && isPres) v.cards = G.drawn.slice();
  if (G.phase === 'chanDraw' && isChan) { v.cards = G.chanCards.slice(); v.canVeto = G.veto && !G.vetoAsked; v.vetoRefused = G.vetoAsked; }
  if (G.phase === 'vetoAsk' && isPres) v.vetoFrom = nameOf(G, G.chanIdx);

  if (G.phase === 'enacted') {
    v.enacted = G.lastEnacted;
    v.byChaos = G.lastByChaos;
    v.power = G.powerKind;
  }

  if (G.phase === 'power') {
    v.power = G.powerKind;
    v.stage = G.powerStage;
    if (G.powerStage === 'select' && isPres) {
      v.targets = G.players.map((p, k) => {
        let why = '';
        if (k === G.presIdx) why = 'זה אתה';
        else if (G.powerKind === 'investigate' && G.investigated.includes(k)) why = 'כבר נחקר בעבר';
        return { i: k, name: p.name, why, ok: validTarget(G, k), alive: p.alive };
      }).filter(t => t.alive);
    }
    if (G.powerStage === 'result') {
      if (G.powerKind === 'peek') { if (isPres) v.peek = G.deck.slice(0, 3); }
      else if (G.powerKind === 'investigate') {
        v.targetName = nameOf(G, G.powerTarget);
        if (isPres) v.loyalty = G.players[G.powerTarget].role === 'liberal' ? 'liberal' : 'fascist';
      } else {
        v.targetName = nameOf(G, G.powerTarget);
      }
    }
  }

  if (G.phase === 'gameover') {
    v.winner = G.winner;
    v.winReason = G.winReason;
    v.reveal = G.players.map(p => ({ name: p.name, role: p.role, alive: p.alive }));
  }

  return v;
}

/* ══════════════ מצב האפליקציה + חיבור ל-React ══════════════ */

const APP = {
  mode: 'menu',        /* menu | connecting | play */
  name: LS.get('sh.name') || '',
  code: '',
  myPid: LS.get('sh.pid') || uid(),
  isHost: false,
  view: null,
  status: '',
};
LS.set('sh.pid', APP.myPid);

const ROOM_PREFIX = 'golazo-sh-';
const HOST = { peer: null, code: null, conns: new Map(), lobby: [], G: null };
const CLIENT = { peer: null, conn: null };

const listeners = new Set();
let revision = 0;
function paint() { revision++; listeners.forEach(fn => fn()); }
function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

function setView(v) {
  APP.view = v;
  APP.mode = 'play';
  paint();
}
/* ══════════════ צד המארח ══════════════ */

function lobbyViewFor(pid) {
  const meIdx = HOST.lobby.findIndex(p => p.id === pid);
  return {
    phase: 'lobby',
    code: HOST.code,
    boardSize: Math.min(10, Math.max(5, HOST.lobby.length)),
    lib: 0, fas: 0, tracker: 0,
    isHost: pid === APP.myPid,
    hostName: HOST.lobby.length ? HOST.lobby[0].name : '',
    players: HOST.lobby.map((p, k) => ({
      name: p.name, alive: true, connected: p.connected,
      pres: false, chan: false, me: k === meIdx,
    })),
    me: { name: meIdx >= 0 ? HOST.lobby[meIdx].name : '', alive: true, role: 'liberal', team: null },
    waiting: [], log: [],
  };
}

function hostBroadcast() {
  const build = pid => (HOST.G ? viewFor(HOST.G, pid) : lobbyViewFor(pid));
  HOST.conns.forEach((conn, pid) => {
    if (!conn || !conn.open) return;
    const v = build(pid);
    if (v) { try { conn.send({ t: 'view', v }); } catch (e) {} }
  });
  setView(build(APP.myPid));
}

function hostSetConnected(pid, on) {
  if (HOST.G) { const p = HOST.G.players.find(x => x.id === pid); if (p) p.connected = on; }
  const l = HOST.lobby.find(x => x.id === pid);
  if (l) l.connected = on;
}

function uniqueName(raw) {
  let name = (raw || '').trim().slice(0, 14) || 'שחקן';
  const taken = HOST.lobby.map(p => p.name);
  if (!taken.includes(name)) return name;
  for (let n = 2; n < 40; n++) if (!taken.includes(name + ' ' + n)) return name + ' ' + n;
  return name + ' ' + Date.now().toString().slice(-3);
}

function hostHandle(conn, msg) {
  if (!msg || typeof msg !== 'object') return;

  if (msg.t === 'join') {
    const pid = typeof msg.pid === 'string' ? msg.pid.slice(0, 40) : '';
    if (!pid) return;
    const known = HOST.lobby.some(p => p.id === pid);

    if (HOST.G && !known) { try { conn.send({ t: 'deny', reason: 'המשחק כבר התחיל — אי אפשר להצטרף באמצע.' }); } catch (e) {} return; }
    if (!HOST.G && !known && HOST.lobby.length >= 10) { try { conn.send({ t: 'deny', reason: 'החדר מלא (10 שחקנים).' }); } catch (e) {} return; }

    HOST.conns.set(pid, conn);
    conn._pid = pid;
    if (!known) HOST.lobby.push({ id: pid, name: uniqueName(msg.name), connected: true });
    else hostSetConnected(pid, true);
    try { conn.send({ t: 'welcome', pid }); } catch (e) {}
    hostBroadcast();
    return;
  }

  if (msg.t === 'act' && conn._pid) {
    if (!HOST.G) {
      if (msg.act && msg.act.a === 'leave') {
        HOST.lobby = HOST.lobby.filter(p => p.id !== conn._pid);
        HOST.conns.delete(conn._pid);
        hostBroadcast();
      }
      return;
    }
    if (applyAction(HOST.G, conn._pid, msg.act)) hostBroadcast();
  }
}

function hostStartGame() {
  if (HOST.G || HOST.lobby.length < 5 || HOST.lobby.length > 10) return;
  HOST.G = createGame(HOST.lobby.map(p => ({ id: p.id, name: p.name })), APP.myPid);
  HOST.lobby.forEach(p => { const g = HOST.G.players.find(x => x.id === p.id); if (g) g.connected = p.connected; });
  hostBroadcast();
}

function hostRestart() {
  if (!HOST.G) return;
  const players = HOST.G.players.map(p => ({ id: p.id, name: p.name }));
  const conn = HOST.G.players.reduce((m, p) => (m[p.id] = p.connected, m), {});
  HOST.G = createGame(players, APP.myPid);
  HOST.G.players.forEach(p => { p.connected = conn[p.id] !== false; });
  hostBroadcast();
}

function makeCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

function createRoom(name) {
  APP.mode = 'connecting'; APP.status = 'פותח חדר…'; paint();
  const Peer = window.Peer;
  if (!Peer) return netFail('רכיב החיבור לא נטען. רעננו את הדף.');

  let attempts = 0;
  const tryOpen = () => {
    const code = makeCode();
    const peer = new Peer(ROOM_PREFIX + code, { debug: 0 });
    let settled = false;

    peer.on('open', () => {
      settled = true;
      HOST.peer = peer; HOST.code = code;
      APP.isHost = true; APP.code = code;
      HOST.lobby = [{ id: APP.myPid, name: uniqueName(name), connected: true }];
      HOST.conns = new Map();
      hostBroadcast();
    });

    peer.on('connection', conn => {
      conn.on('data', msg => hostHandle(conn, msg));
      conn.on('close', () => { if (conn._pid) { hostSetConnected(conn._pid, false); hostBroadcast(); } });
      conn.on('error', () => {});
    });

    peer.on('error', err => {
      const type = err && err.type;
      if (!settled && type === 'unavailable-id' && ++attempts < 6) { try { peer.destroy(); } catch (e) {} return tryOpen(); }
      if (!settled) return netFail('לא הצלחתי לפתוח חדר. ייתכן שהרשת חוסמת את החיבור — נסו רשת אחרת.');
      if (type === 'network' || type === 'server-error' || type === 'socket-error') {
        APP.status = 'החיבור לשרת התיווך נותק — השחקנים המחוברים ממשיכים לעבוד.';
        paint();
      }
    });
  };
  tryOpen();
}

/* ══════════════ צד השחקן המצטרף ══════════════ */

function joinRoom(code, name) {
  APP.mode = 'connecting'; APP.status = 'מתחבר לחדר ' + code + '…'; paint();
  const Peer = window.Peer;
  if (!Peer) return netFail('רכיב החיבור לא נטען. רעננו את הדף.');

  const peer = new Peer({ debug: 0 });
  CLIENT.peer = peer;
  let opened = false;

  peer.on('open', () => {
    const conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
    CLIENT.conn = conn;
    const giveUp = setTimeout(() => { if (!opened) netFail('לא נמצא חדר עם הקוד ' + code + '. בדקו את הקוד ושהמארח לא סגר את הדף.'); }, 12000);

    conn.on('open', () => {
      opened = true;
      clearTimeout(giveUp);
      APP.isHost = false; APP.code = code;
      conn.send({ t: 'join', pid: APP.myPid, name });
    });
    conn.on('data', msg => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'view') setView(msg.v);
      else if (msg.t === 'deny') netFail(msg.reason || 'ההצטרפות נדחתה.');
    });
    conn.on('close', () => {
      if (APP.mode === 'play') { APP.mode = 'connecting'; APP.status = 'החיבור למארח נותק. בקשו ממנו לוודא שהדף פתוח, ונסו להצטרף שוב.'; paint(); }
    });
    conn.on('error', () => {});
  });

  peer.on('error', err => {
    const type = err && err.type;
    if (type === 'peer-unavailable') return netFail('לא נמצא חדר עם הקוד ' + code + '. בדקו את הקוד ושהמארח לא סגר את הדף.');
    if (!opened) netFail('החיבור נכשל. אם אתם ברשת סלולרית, נסו להתחבר לאותו WiFi של שאר השחקנים.');
  });
}

function netFail(msg) {
  APP.mode = 'menu';
  APP.status = msg;
  APP.view = null;
  paint();
}

/* ── שליחת פעולה ── */
function doAction(act) {
  if (APP.isHost) {
    if (!HOST.G) return;
    if (applyAction(HOST.G, APP.myPid, act)) hostBroadcast();
  } else if (CLIENT.conn && CLIENT.conn.open) {
    try { CLIENT.conn.send({ t: 'act', act }); } catch (e) {}
  }
}

/* מה קרה בין שתי תצוגות? מכאן נגזרות האנימציות. */
function detectFx(prev, v) {
  const out = [];
  if (!v || !prev) return out;

  if (v.phase === 'voteResult' && prev.phase !== 'voteResult') out.push({ k: v.passed ? 'pass' : 'fail' });
  if (v.phase === 'vetoAsk' && prev.phase !== 'vetoAsk') out.push({ k: 'vetoask' });
  if (prev.phase === 'vetoAsk' && v.phase !== 'vetoAsk' && v.lib === prev.lib && v.fas === prev.fas) out.push({ k: 'veto' });
  if (v.phase === 'enacted' && v.byChaos && prev.phase !== 'enacted') out.push({ k: 'chaos' });
  if (v.lib > prev.lib) out.push({ k: 'lib' });
  if (v.fas > prev.fas) out.push({ k: 'fas' });

  if (v.phase === 'power' && v.stage === 'result' && !(prev.phase === 'power' && prev.stage === 'result')) {
    if (v.power === 'kill') out.push({ k: 'kill', sub: v.targetName });
    else if (v.power === 'special') out.push({ k: 'special', sub: v.targetName });
    else if (v.power === 'investigate') out.push({ k: 'invest', sub: v.targetName });
    else if (v.power === 'peek') out.push({ k: 'peek' });
  }

  if (v.phase === 'gameover' && prev.phase !== 'gameover') {
    if (/היטלר נבחר/.test(v.winReason)) out.push({ k: 'hitler' });
    out.push({ k: v.winner === 'liberal' ? 'winlib' : 'winfas', sub: v.winReason });
  }

  /* התור עבר אליך */
  const myTurn = x => x && ((x.phase === 'nominate' && x.isPres) || (x.phase === 'presDraw' && x.isPres) ||
    (x.phase === 'chanDraw' && x.isChan) || (x.phase === 'vetoAsk' && x.isPres) ||
    (x.phase === 'power' && x.stage === 'select' && x.isPres));
  if (myTurn(v) && !myTurn(prev)) out.push({ k: 'turn' });

  return out;
}

function FxLayer({ event, onDone }) {
  useEffect(() => {
    if (!event) return;
    const cfg = FX[event.k];
    if (cfg && cfg.buzz) buzz(cfg.buzz);
    const t = setTimeout(onDone, (cfg ? cfg.ms : 1200));
    return () => clearTimeout(t);
  }, [event, onDone]);

  if (!event) return null;
  const cfg = FX[event.k];
  if (!cfg) return null;
  const sub = event.sub || cfg.sub;

  return html`
    <div className="fx" style=${{ color: cfg.color }} aria-hidden="true">
      ${cfg.flash && html`<div className="fx-flash" style=${{ background: 'radial-gradient(circle at 50% 45%, ' + cfg.color + '66, transparent 68%)' }}></div>`}
      ${cfg.rays && html`<div className="fx-rays"></div>`}
      ${cfg.spot && html`<div className="fx-spot"></div>`}
      ${cfg.slash && html`<div className="fx-slash"></div>`}
      ${cfg.crack && html`<div className="fx-crack" style=${{ background: 'repeating-linear-gradient(72deg, transparent 0 22px, ' + cfg.color + '30 22px 24px)' }}></div>`}
      <div className="fx-stamp">
        ${cfg.stamp}
        ${sub && html`<small>${sub}</small>`}
      </div>
    </div>`;
}

  return html`
    <div className="panel" style=${{ borderColor: 'var(--brass)' }}>
      <p className="hint" style=${{ textAlign: 'center', marginBottom: '10px' }}>${text}</p>
      <div className="btn-row">
        <button className=${'btn btn--sm ' + (danger ? 'btn--blood' : 'btn--primary')} onClick=${onYes}>${label}</button>
        <button className="btn btn--sm btn--ghost" onClick=${onNo}>ביטול</button>
      </div>
    </div>`;
}

/* ── מסכי המשחק ── */

function GameScreen({ v, ui, setUi, act }) {
  const P = v.power ? POWER_INFO[v.power] : null;
  const pick = i => setUi(u => ({ ...u, pending: u.pending === i ? null : i }));
  const clear = () => setUi(u => ({ ...u, pending: null }));
  let body = null;

  switch (v.phase) {

    case 'nominate':
      body = v.isPres
        ? html`<${React.Fragment}>
            <div className="turn">תורך — בחר מועמד לקנצלר</div>
            <div className="panel">
              <div className="eyebrow">מינוי קנצלר</div>
              <p className="hint" style=${{ margin: '10px 0 12px' }}>כולם יצביעו על ההצעה שלך מהטלפון שלהם.</p>
              <${SelList} items=${v.candidates} pending=${null} onPick=${i => act({ a: 'nominate', i })}/>
            </div><//>`
        : html`<${Wait} names=${[v.presName]} what="הנשיא בוחר מועמד לקנצלר"/>`;
      break;

    case 'vote':
      body = (v.myVote === null && v.me.alive)
        ? html`<div className="panel">
            <div className="banner neutral" style=${{ marginBottom: '14px' }}>
              נשיא: ${v.presName}<br/>קנצלר מוצע: ${v.chanName}
              <div className="b-sub">מאשרים את הממשלה הזו?</div>
            </div>
            <div className="vote-row">
              <button className="vote-btn ja" onClick=${() => act({ a: 'vote', v: true })}>כן<small>JA</small></button>
              <button className="vote-btn nein" onClick=${() => act({ a: 'vote', v: false })}>לא<small>NEIN</small></button>
            </div>
            <p className="hint" style=${{ textAlign: 'center', marginTop: '10px' }}>ההצבעה חשאית ותיחשף רק כשכולם יצביעו.</p>
          </div>`
        : html`<div className="panel">
            <p className="hint" style=${{ textAlign: 'center', marginBottom: '12px' }}>
              ${v.me.alive ? 'הצבעת ' + (v.myVote ? 'כן' : 'לא') + '. ממתינים לשאר.' : 'אתם מחוץ למשחק ואינכם מצביעים.'}
            </p>
            <div className="voted-list">
              ${v.voted.map((x, i) => html`<span key=${i} className=${'voted-chip' + (x.done ? ' done' : '')}>${x.done ? '✓ ' : ''}${x.name}</span>`)}
            </div>
            ${v.isHost && v.anyDisconnected && html`
              <button className="btn btn--ghost btn--sm" style=${{ marginTop: '14px' }}
                      onClick=${() => act({ a: 'skipDisconnected' })}>סמן "לא" עבור המנותקים</button>`}
          </div>`;
      break;

    case 'voteResult': {
      const ja = v.votes.filter(x => x.v).length;
      body = html`<${React.Fragment}>
        <div className=${'banner ' + (v.passed ? 'lib' : 'fas')}>
          ${v.passed ? 'הממשלה אושרה' : 'הממשלה נדחתה'}
          <div className="b-sub"><bdi>${ja} בעד</bdi> • <bdi>${v.votes.length - ja} נגד</bdi></div>
        </div>
        <div className="panel">
          <div className="vote-list">
            ${v.votes.map((x, i) => html`
              <div key=${i} className="vote-item"><span>${x.name}</span>
                <span className=${x.v ? 'v-ja' : 'v-nein'}>${x.v ? 'כן' : 'לא'}</span></div>`)}
          </div>
        </div>
        ${v.chaosNext && html`<p className="hint" style=${{ textAlign: 'center', color: '#f08a8a' }}>
          זו ההצבעה הכושלת השלישית ברצף — כאוס: המדיניות העליונה תעבור אוטומטית.</p>`}
        ${v.isPres
          ? html`<button className="btn btn--primary" onClick=${() => act({ a: 'continue' })}>${v.passed ? 'המשך למליאה' : 'המשך'}</button>`
          : html`<${Wait} names=${[v.presName]} what="ממתינים שהנשיא ימשיך"/>`}
      <//>`;
      break;
    }

    case 'presDraw':
      body = v.isPres
        ? html`<${React.Fragment}>
            <div className="turn">תורך — השלך קלף אחד</div>
            <div className="panel">
              <div className="eyebrow">המליאה · הנשיא</div>
              <p className="hint" style=${{ margin: '10px 0 14px' }}>שני הנותרים יעברו לקנצלר ${v.chanName}. אין לדבר בזמן המליאה.</p>
              <div className="pol-row">
                ${v.cards.map((c, i) => html`<${PolicyCard} key=${i} card=${c} sub="השלך"
                  state=${ui.pending == null ? null : (ui.pending === i ? 'sel' : 'dim')} onClick=${() => pick(i)}/>`)}
              </div>
            </div>
            ${ui.pending != null && html`<${Confirm}
              text=${'להשליך מדיניות ' + (v.cards[ui.pending] === 'L' ? 'ליברלית' : 'פשיסטית') + '?'}
              label="כן, השלך" onYes=${() => { clear(); act({ a: 'discard', i: ui.pending }); }} onNo=${clear}/>`}
          <//>`
        : html`<${Wait} names=${[v.presName]} what="הנשיא מקבל שלושה קלפים ומשליך אחד"/>`;
      break;

    case 'chanDraw':
      body = v.isChan
        ? html`<${React.Fragment}>
            <div className="turn">תורך — בחר מדיניות להעברה</div>
            <div className="panel">
              <div className="eyebrow">המליאה · הקנצלר</div>
              <p className="hint" style=${{ margin: '10px 0 14px' }}>הקלף שתבחר יועבר בפומבי. השני יושלך.</p>
              <div className="pol-row">
                ${v.cards.map((c, i) => html`<${PolicyCard} key=${i} card=${c} sub="העבר"
                  state=${ui.pending == null ? null : (ui.pending === i ? 'sel' : 'dim')} onClick=${() => pick(i)}/>`)}
              </div>
            </div>
            ${ui.pending != null
              ? html`<${Confirm}
                  text=${'להעביר מדיניות ' + (v.cards[ui.pending] === 'L' ? 'ליברלית' : 'פשיסטית') + '?'}
                  label="כן, העבר" onYes=${() => { clear(); act({ a: 'enact', i: ui.pending }); }} onNo=${clear}/>`
              : (v.canVeto && html`<button className="btn btn--ghost" onClick=${() => act({ a: 'veto' })}>🚫 בקשת וטו</button>`)}
            ${v.vetoRefused && html`<p className="hint" style=${{ textAlign: 'center', color: '#f08a8a' }}>הנשיא דחה את הווטו — חובה להעביר מדיניות.</p>`}
          <//>`
        : html`<${Wait} names=${[v.chanName]} what="הקנצלר בוחר איזו מדיניות להעביר"/>`;
      break;

    case 'vetoAsk':
      body = v.isPres
        ? html`<${React.Fragment}>
            <div className="banner neutral">הקנצלר ${v.vetoFrom} מבקש לבטל את שתי המדיניות
              <div className="b-sub">אם תסכים — לא תועבר מדיניות, ומד הבחירות הכושלות יעלה באחד.</div></div>
            <button className="btn btn--blood" onClick=${() => act({ a: 'vetoYes' })}>מסכים לווטו</button>
            <button className="btn" onClick=${() => act({ a: 'vetoNo' })}>מסרב — שיעביר מדיניות</button>
          <//>`
        : html`<${Wait} names=${[v.presName]} what="הקנצלר ביקש וטו — הנשיא מחליט"/>`;
      break;

    case 'enacted':
      body = html`<${React.Fragment}>
        <div className=${'banner ' + (v.enacted === 'L' ? 'lib' : 'fas')}>
          ${v.enacted === 'L' ? 'הועברה מדיניות ליברלית' : 'הועברה מדיניות פשיסטית'}
          <div className="b-sub">${v.byChaos ? 'כאוס — המדיניות העליונה הועברה אוטומטית' : 'נשיא ' + v.presName + ' • קנצלר ' + v.chanName}</div>
        </div>
        ${P && html`<div className="panel">
          <div className="eyebrow">כוח נשיאותי</div>
          <div className="panel-t" style=${{ marginTop: '10px' }}>${P.icon} ${P.name}</div>
          <p className="hint">${P.desc}</p></div>`}
        ${v.isPres
          ? html`<button className="btn btn--primary" onClick=${() => act({ a: 'continue' })}>${P ? 'המשך — הפעלת הכוח' : 'המשך לסבב הבא'}</button>`
          : html`<${Wait} names=${[v.presName]} what="ממתינים שהנשיא ימשיך"/>`}
      <//>`;
      break;

    case 'power':
      if (v.stage === 'select') {
        body = v.isPres
          ? html`<${React.Fragment}>
              <div className="turn">תורך — ${P.name}</div>
              <div className="panel">
                <div className="eyebrow">${P.icon} ${P.name}</div>
                <p className="hint" style=${{ margin: '10px 0 12px' }}>${P.desc}</p>
                <${SelList} items=${v.targets} pending=${v.power === 'kill' ? ui.pending : null}
                  onPick=${i => v.power === 'kill' ? pick(i) : act({ a: 'power', i })}/>
              </div>
              ${v.power === 'kill' && ui.pending != null && html`<${Confirm} danger=${true}
                text=${'להוציא להורג את ' + ((v.targets.find(t => t.i === ui.pending) || {}).name || '') + '? הפעולה בלתי הפיכה.'}
                label="כן, הוצא להורג" onYes=${() => { clear(); act({ a: 'power', i: ui.pending }); }} onNo=${clear}/>`}
            <//>`
          : html`<${Wait} names=${[v.presName]} what=${'הנשיא מפעיל: ' + P.name}/>`;
      } else if (v.power === 'peek') {
        body = v.isPres
          ? html`<${React.Fragment}>
              <div className="panel">
                <div className="eyebrow">🔮 שלושת הקלפים העליונים</div>
                <div className="pol-row" style=${{ marginTop: '12px' }}>
                  ${v.peek.map((c, i) => html`<${PolicyCard} key=${i} card=${c} sub=${['הבא בתור','אחריו','שלישי'][i]}/>`)}
                </div>
              </div>
              <p className="hint" style=${{ textAlign: 'center' }}>מותר לך לשקר לגבי מה שראית.</p>
              <button className="btn btn--primary" onClick=${() => act({ a: 'continue' })}>סיימתי — המשך</button>
            <//>`
          : html`<${Wait} names=${[v.presName]} what="הנשיא מציץ בשלושת הקלפים הבאים"/>`;
      } else if (v.power === 'investigate') {
        body = v.isPres
          ? html`<${React.Fragment}>
              <div className=${'rolecard ' + (v.loyalty === 'liberal' ? 'lib' : 'fas')}>
                <div className="r-lbl">השתייכות מפלגתית של</div>
                <div className="r-name" style=${{ fontSize: '1.5rem' }}>${v.targetName}</div>
                <div className="r-name">${v.loyalty === 'liberal' ? 'ליברל' : 'פשיסט'}</div>
                <div className="r-desc">זו המפלגה בלבד — היטלר נראה כאן כ"פשיסט".</div>
              </div>
              <p className="hint" style=${{ textAlign: 'center' }}>מותר לך לשקר לגבי מה שראית.</p>
              <button className="btn btn--primary" onClick=${() => act({ a: 'continue' })}>סיימתי — המשך</button>
            <//>`
          : html`<${Wait} names=${[v.presName]} what=${'הנשיא חוקר את ' + v.targetName}/>`;
      } else {
        const kill = v.power === 'kill';
        body = html`<${React.Fragment}>
          <div className=${'banner ' + (kill ? 'fas' : 'neutral')}>
            ${kill ? v.targetName + ' הוצא להורג' : v.targetName + ' יהיה הנשיא בסבב הבא'}
            <div className="b-sub">${kill ? 'השחקן יצא מהמשחק ואינו מצביע. אסור לו לחשוף את תפקידו.' : 'אחרי הסבב הזה הנשיאות חוזרת לסדר הרגיל.'}</div>
          </div>
          ${v.isPres
            ? html`<button className="btn btn--primary" onClick=${() => act({ a: 'continue' })}>המשך לסבב הבא</button>`
            : html`<${Wait} names=${[v.presName]} what="ממתינים שהנשיא ימשיך"/>`}
        <//>`;
      }
      break;
  }

  return html`
    <div className="screen fade-in">
      <${Topbar} title=${'סבב ' + v.round} onSheet=${s => setUi(u => ({ ...u, sheet: s }))}/>
      <${Board} v=${v}/>
      <${Players} v=${v}/>
      <${RoleStrip} v=${v} shown=${ui.showRole} onToggle=${() => setUi(u => ({ ...u, showRole: !u.showRole }))}/>
      ${body}
    </div>`;
}

function RolesScreen({ v, ui, setUi, act }) {
  const r = v.me.role;
  const roleName = r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  const desc = r === 'liberal'
    ? 'המטרה שלך: להעביר 5 מדיניות ליברליות, או להוציא להורג את היטלר. אינך יודע מי אף אחד.'
    : (r === 'hitler'
      ? 'המטרה שלך: להיראות ליברל. אם יועברו 3 מדיניות פשיסטיות ואז ייבחרו אותך לקנצלר — ניצחתם. אם יוציאו אותך להורג — הפסדתם.'
      : 'המטרה שלך: להעביר 6 מדיניות פשיסטיות, או להכניס את היטלר לקנצלרות אחרי 3 מדיניות פשיסטיות.');

  return html`
    <div className="screen fade-in">
      <${Topbar} title="התפקיד שלך" onSheet=${s => setUi(u => ({ ...u, sheet: s }))}/>
      <div className=${'rolecard ' + (r === 'liberal' ? 'lib' : 'fas')}>
        <div className="r-lbl">${v.me.name}</div>
        <div className="r-name">${roleName}</div>
        <div className="r-desc">${desc}</div>
        ${v.me.team && v.me.team.length
          ? html`<div className="team-box">
              <div className="t-lbl">${r === 'hitler' ? 'הפשיסט שלך' : 'הצוות שלך'}</div>
              <div className="t-names">${v.me.team.map((t, i) => html`<div key=${i}>${t.name}${t.hitler ? ' — היטלר' : ''}</div>`)}</div>
            </div>`
          : (r === 'hitler' && html`<div className="team-box">
              <div className="t-lbl">הצוות שלך</div>
              <div className="t-names" style=${{ fontSize: '.85rem', fontWeight: 700 }}>בהרכב הזה אינך יודע מי הפשיסטים — הם מכירים אותך ויגנו עליך.</div>
            </div>`)}
      </div>
      <p className="hint" style=${{ textAlign: 'center' }}>המסך הזה פרטי לך. אל תראה אותו לאף אחד.</p>
      ${v.ready
        ? html`<${Wait} names=${v.waiting} what=${'ממתינים שכולם יאשרו (' + v.readyCount + ' מתוך ' + v.players.length + ')'}/>`
        : html`<button className="btn btn--primary" onClick=${() => act({ a: 'ready' })}>ראיתי — אני מוכן</button>`}
    </div>`;
}

function GameOverScreen({ v, setUi, act }) {
  const libWin = v.winner === 'liberal';
  const roleName = r => r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  return html`
    <div className="screen fade-in">
      <${Topbar} title="סוף המשחק" onSheet=${s => setUi(u => ({ ...u, sheet: s }))}/>
      <div className=${'banner ' + (libWin ? 'lib' : 'fas')} style=${{ padding: '28px 18px', fontSize: '1.6rem' }}>
        ${libWin ? 'הליברלים ניצחו' : 'הפשיסטים ניצחו'}
        <div className="b-sub" style=${{ fontSize: '.9rem' }}>${v.winReason}</div>
      </div>
      <${Board} v=${v}/>
      <div className="panel">
        <div className="eyebrow">חשיפת התפקידים</div>
        <div className="sel-list" style=${{ marginTop: '12px' }}>
          ${v.reveal.map((p, i) => html`
            <div key=${i} className="sel" style=${{ pointerEvents: 'none', borderColor: p.role === 'liberal' ? '#2b5f8f' : '#6d0a10', opacity: p.alive ? 1 : .55 }}>
              <span>${p.name}${p.alive ? '' : ' 💀'}</span>
              <span className="why" style=${{ fontWeight: 800, color: p.role === 'liberal' ? '#a8cdf0' : '#f3a2a2' }}>${roleName(p.role)}</span>
            </div>`)}
        </div>
      </div>
      ${v.isHost
        ? html`<button className="btn btn--primary" onClick=${() => act({ a: 'restart' })}>סיבוב נוסף עם אותם שחקנים</button>`
        : html`<${Wait} names=${[v.hostName || v.presName]} what="ממתינים שהמארח יתחיל סיבוב נוסף"/>`}
    </div>`;
}

function LobbyScreen({ v, setUi, onStart, onShare, shareLabel }) {
  const enough = v.players.length >= 5;
  return html`
    <div className="screen fade-in">
      <${Topbar} title="חדר משחק" onSheet=${s => setUi(u => ({ ...u, sheet: s }))}/>
      <div className="code-box">
        <div className="eyebrow solo" style=${{ justifyContent: 'center' }}>קוד החדר</div>
        <div className="c-val">${v.code}</div>
        <div className="hint">כל שחקן פותח את אותו קישור, בוחר "הצטרפות לחדר" ומקליד את הקוד.</div>
      </div>
      <button className="btn btn--sm btn--ghost" onClick=${onShare}>${shareLabel}</button>
      <div className="panel">
        <div className="eyebrow">מחוברים <span className="tag" dir="ltr">${v.players.length} / 10</span></div>
        <div style=${{ marginTop: '12px' }}><${Players} v=${v}/></div>
        <p className="hint" style=${{ marginTop: '12px' }}>
          ${enough ? 'אפשר להתחיל. מי שיצטרף אחרי ההתחלה לא ייכנס למשחק.'
                   : 'צריך לפחות 5 שחקנים — חסרים עוד ' + (5 - v.players.length) + '.'}
        </p>
      </div>
      ${v.isHost
        ? html`<button className="btn btn--primary" disabled=${!enough} onClick=${onStart}>התחל משחק</button>`
        : html`<${Wait} names=${[v.hostName]} what="ממתינים שהמארח יתחיל את המשחק"/>`}
      <p className="hint" style=${{ textAlign: 'center' }}>אל תסגרו את הדף — החיבור נשמר כל עוד הוא פתוח.</p>
    </div>`;
}

function MenuScreen({ setUi, onCreate, onJoin, status }) {
  const [name, setName] = useState(APP.name);
  const [code, setCode] = useState(APP.code);
  useEffect(() => { APP.name = name; LS.set('sh.name', name); }, [name]);
  useEffect(() => { APP.code = code; }, [code]);

  return html`
    <div className="screen fade-in">
      <div className="hero">
        <img className="mark" src="logo.svg" alt=""/>
        <h1 className="display">סיקרט היטלר</h1>
        <p className="sub">כל שחקן מהטלפון שלו · <bdi>5–10</bdi> שחקנים · בלי הרשמה</p>
      </div>
      <div className="rule"><i></i></div>
      ${status && html`<div className="banner neutral" style=${{ fontSize: '.92rem' }}>${status}</div>`}
      <div className="panel">
        <div className="eyebrow">איך קוראים לך</div>
        <input className="name-inp" style=${{ marginTop: '11px' }} value=${name} maxLength=${14}
               placeholder="השם שלך" autoComplete="off" onInput=${e => setName(e.target.value)}/>
      </div>
      <button className="btn btn--primary" onClick=${() => onCreate(name)}>פתיחת חדר חדש</button>
      <div className="panel">
        <div className="eyebrow">הצטרפות לחדר קיים</div>
        <input className="code-inp" style=${{ marginTop: '11px' }} value=${code} placeholder="0000"
               inputMode="numeric" maxLength=${4}
               onInput=${e => setCode(e.target.value.replace(/\D/g, '').slice(0, 4))}/>
        <button className="btn btn--sm" style=${{ marginTop: '12px' }} onClick=${() => onJoin(code, name)}>הצטרפות</button>
      </div>
      <button className="btn btn--ghost btn--sm" onClick=${() => setUi(u => ({ ...u, sheet: 'rules' }))}>📖 חוקי המשחק</button>
      <p className="hint" style=${{ textAlign: 'center' }}>
        רוצים לשחק על מכשיר אחד שעובר בין כולם? יש <a href="secret-hitler.html" style=${{ color: 'var(--brass)' }}>גם גרסה כזו</a>.
      </p>
    </div>`;
}

function ConnectingScreen({ status, onBack }) {
  return html`
    <div className="screen center fade-in">
      <div className="wait" style=${{ flex: 1, justifyContent: 'center' }}>
        <div className="spinner"></div>
        <div className="w-who">${status || 'מתחבר…'}</div>
        <button className="btn btn--ghost" style=${{ marginTop: '10px' }} onClick=${onBack}>חזרה למסך הפתיחה</button>
      </div>
    </div>`;
}

/* ── גיליונות ── */
function Sheet({ kind, v, onClose }) {
  const stop = e => e.stopPropagation();
  let inner;
  if (kind === 'log') {
    const items = (v && v.log) || [];
    inner = html`<${React.Fragment}>
      <h3>🗒️ יומן המשחק</h3>
      <div className="log-list">
        ${items.length
          ? items.map((l, i) => html`<div key=${i} className="log-item"><span className="rnd">סבב ${l.r}</span>${l.text}</div>`)
          : html`<div className="log-item">עוד לא קרה כלום.</div>`}
      </div><//>`;
  } else {
    const n = (v && v.boardSize) || 7;
    const pw = POWERS[n] || POWERS[7];
    inner = html`<${React.Fragment}>
      <h3>📖 חוקי המשחק</h3>
      <div className="rules-h">המטרה</div>
      <p className="rules-p">ליברלים: להעביר 5 מדיניות ליברליות, או להוציא את היטלר להורג.<br/>
        פשיסטים: להעביר 6 מדיניות פשיסטיות, או להכניס את היטלר לתפקיד קנצלר אחרי 3 מדיניות פשיסטיות.</p>
      <div className="rules-h">מהלך סבב</div>
      <ul className="rules-ul">
        <li>הנשיאות עוברת לפי סדר ההצטרפות לחדר. הנשיא מציע קנצלר.</li>
        <li>כולם מצביעים כן/לא מהטלפון שלהם. רוב מאשר; תיקו נחשב כישלון.</li>
        <li>ממשלה שאושרה: הנשיא מושך 3 קלפים ומשליך אחד, הקנצלר מקבל 2 ומעביר אחד.</li>
        <li>אסור להראות את המסך — מותר לשקר.</li>
        <li>שלוש הצבעות כושלות ברצף = כאוס: הקלף העליון מועבר אוטומטית.</li>
      </ul>
      <div className="rules-h">הגבלות מועמדות</div>
      <p className="rules-p">מי שכיהן כנשיא או כקנצלר בממשלה האחרונה שאושרה אינו יכול להיות מועמד לקנצלרות.
        אם נותרו 5 שחקנים או פחות — רק הקנצלר האחרון חסום.</p>
      <div className="rules-h">כוחות הנשיא בלוח של ${n} שחקנים</div>
      <ul className="rules-ul">
        ${pw.map((k, i) => html`<li key=${i}>מדיניות פשיסטית ${i + 1}: ${k ? POWER_INFO[k].name : 'ללא כוח'}</li>`)}
        <li>אחרי 5 מדיניות פשיסטיות נפתח גם הווטו.</li>
      </ul>
      <div className="rules-h">החפיסה</div>
      <p className="rules-p">בחפיסה <bdi>17</bdi> קלפים: <bdi>6</bdi> ליברליים ו-<bdi>11</bdi> פשיסטיים.
        כשנשארים פחות מ-3, ההשלכות מעורבבות בחזרה.</p>
    <//>`;
  }
  return html`
    <div className="overlay" onClick=${onClose}>
      <div className="sheet" onClick=${stop}>
        ${inner}
        <button className="btn btn--ghost" style=${{ marginTop: '16px' }} onClick=${onClose}>סגור</button>
      </div>
    </div>`;
}

/* ══════════════ האפליקציה ══════════════ */

function App() {
  const [, force] = useState(0);
  const [ui, setUi] = useState({ sheet: null, showRole: false, pending: null });
  const [fxQueue, setFxQueue] = useState([]);
  const [shareLabel, setShareLabel] = useState('📎 העתקת הקישור לשליחה בוואטסאפ');
  const prevView = useRef(null);
  const prevPhase = useRef(null);

  useEffect(() => subscribe(() => force(x => x + 1)), []);

  const v = APP.view;

  /* איפוס בחירה מקומית כשמשתנה השלב */
  useEffect(() => {
    if (v && v.phase !== prevPhase.current) {
      prevPhase.current = v.phase;
      setUi(u => (u.pending == null ? u : { ...u, pending: null }));
    }
  }, [v && v.phase]);

  /* גילוי אירועים → תור אנימציות */
  useEffect(() => {
    const events = detectFx(prevView.current, v);
    prevView.current = v;
    if (events.length) setFxQueue(q => q.concat(events));
  }, [v]);

  const fx = fxQueue[0] || null;
  const fxDone = useCallback(() => setFxQueue(q => q.slice(1)), []);

  const act = useCallback(a => {
    if (a.a === 'restart') { if (APP.isHost) hostRestart(); return; }
    doAction(a);
  }, []);

  const onShare = useCallback(() => {
    const url = location.href.split('#')[0] + '#' + HOST.code;
    const text = 'בואו לשחק סיקרט היטלר! קוד החדר: ' + HOST.code + '\n' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => setShareLabel('✓ הקישור הועתק'),
        () => setShareLabel(url));
    } else setShareLabel(url);
  }, []);

  let screen;
  if (APP.mode === 'menu') {
    screen = html`<${MenuScreen} setUi=${setUi} status=${APP.status}
      onCreate=${name => {
        const n = (name || '').trim();
        if (!n) { APP.status = 'צריך להזין שם לפני שפותחים חדר.'; return paint(); }
        APP.status = ''; createRoom(n);
      }}
      onJoin=${(code, name) => {
        const n = (name || '').trim();
        if (!n) { APP.status = 'צריך להזין שם.'; return paint(); }
        if ((code || '').length !== 4) { APP.status = 'קוד החדר הוא ארבע ספרות.'; return paint(); }
        APP.status = ''; joinRoom(code, n);
      }}/>`;
  } else if (APP.mode === 'connecting') {
    screen = html`<${ConnectingScreen} status=${APP.status}
      onBack=${() => { APP.mode = 'menu'; APP.status = ''; paint(); }}/>`;
  } else if (!v) {
    screen = html`<${ConnectingScreen} status="טוען…" onBack=${() => { APP.mode = 'menu'; paint(); }}/>`;
  } else if (v.phase === 'lobby') {
    screen = html`<${LobbyScreen} v=${v} setUi=${setUi} onStart=${hostStartGame} onShare=${onShare} shareLabel=${shareLabel}/>`;
  } else if (v.phase === 'roles') {
    screen = html`<${RolesScreen} v=${v} ui=${ui} setUi=${setUi} act=${act}/>`;
  } else if (v.phase === 'gameover') {
    screen = html`<${GameOverScreen} v=${v} setUi=${setUi} act=${act}/>`;
  } else {
    screen = html`<${GameScreen} v=${v} ui=${ui} setUi=${setUi} act=${act}/>`;
  }

  const shaking = fx && FX[fx.k] && FX[fx.k].shake;

  return html`
    <div className=${shaking ? 'shake' : ''}>
      ${screen}
      ${ui.sheet && html`<${Sheet} kind=${ui.sheet} v=${v} onClose=${() => setUi(u => ({ ...u, sheet: null }))}/>`}
      <${FxLayer} event=${fx} onDone=${fxDone}/>
    </div>`;
}

/* ══════════════ אתחול ══════════════ */
window.addEventListener('beforeunload', e => {
  if (APP.mode === 'play' && APP.isHost && HOST.G && HOST.G.phase !== 'gameover') { e.preventDefault(); e.returnValue = ''; }
});

(function boot() {
  const hash = (location.hash || '').replace(/\D/g, '');
  if (hash.length === 4) APP.code = hash;
  const root = document.getElementById('root');
  if (!window.React || !window.ReactDOM || !window.htm) {
    root.innerHTML = '<div class="screen center"><div class="panel"><div class="panel-t">המשחק לא נטען</div>' +
      '<p class="hint">קבצי הספרייה חסרים. ודאו שתיקיית vendor הועלתה יחד עם הדף, ורעננו.</p></div></div>';
    return;
  }
  ReactDOM.createRoot(root).render(h(App));
})();
</script>
</body>
</html>
