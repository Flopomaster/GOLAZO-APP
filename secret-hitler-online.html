<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="סיקרט היטלר אונליין – כל שחקן מהטלפון שלו">
<title>סיקרט היטלר אונליין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' fill='%23f0b429' text-anchor='middle'%3ESH%3C/text%3E%3C/svg%3E">
<style>

:root{
  --bg:#0b0d12; --surface:#161a23; --surface2:#1e2430; --line:#2a3345;
  --text:#e6e9f0; --muted:#8b96ab;
  --lib:#3b82f6; --lib-dim:#1d3a6b;
  --fas:#dc2626; --fas-dim:#5c1b1b;
  --gold:#f0b429; --ok:#22c55e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Heebo','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
input,button,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* ── LAYOUT ── */
.screen{
  max-width:540px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;min-height:100dvh;
}
.grow{flex:1}
.center{justify-content:center;text-align:center}

/* ── TITLE ── */
.logo{text-align:center;padding:10px 0 4px}
.logo-mark{
  width:64px;height:64px;margin:0 auto 12px;border-radius:16px;
  background:linear-gradient(145deg,var(--fas),#7f1d1d);
  display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:#fff;
  box-shadow:0 10px 30px #dc262640;letter-spacing:1px;
}
.logo h1{font-size:2rem;font-weight:900;letter-spacing:-.5px}
.logo .sub{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.6}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card-t{font-size:.95rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pill{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px}
.hint{font-size:.78rem;color:var(--muted);line-height:1.65}

/* ── BUTTONS ── */
.btn{
  display:block;width:100%;padding:15px 16px;border-radius:14px;
  font-size:1rem;font-weight:800;text-align:center;
  background:var(--surface2);color:var(--text);border:1px solid var(--line);
  transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:linear-gradient(160deg,var(--gold),#d99a12);color:#1a1204;border-color:transparent}
.btn-lib{background:var(--lib);color:#fff;border-color:transparent}
.btn-fas{background:var(--fas);color:#fff;border-color:transparent}
.btn-ok{background:var(--ok);color:#05230f;border-color:transparent}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);font-weight:700}
.btn-sm{padding:11px 14px;font-size:.88rem}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}

/* ── SETUP NAMES ── */
.names{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.name-row{display:flex;align-items:center;gap:9px}
.seat{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface2);
  color:var(--muted);font-size:.72rem;font-weight:800;display:grid;place-items:center;
}
.name-inp{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:1rem;font-weight:700;padding:12px 13px;outline:none;
}
.name-inp:focus{border-color:var(--gold)}
.x{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:.9rem}

/* ── BOARD ── */
.board{display:flex;flex-direction:column;gap:10px}
.track{border-radius:14px;padding:10px 11px;border:1px solid var(--line)}
.track.lib{background:linear-gradient(180deg,#0f1d33,#0d1626)}
.track.fas{background:linear-gradient(180deg,#2a1010,#1c0c0c)}
.track-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.track-name{font-size:.72rem;font-weight:900;letter-spacing:1px}
.track.lib .track-name{color:#93c5fd}
.track.fas .track-name{color:#fca5a5}
.track-count{font-size:.7rem;font-weight:800;color:var(--muted)}
.slots{display:flex;gap:5px}
.slot{
  flex:1;aspect-ratio:.72;border-radius:7px;border:1px dashed #ffffff26;
  display:grid;place-items:center;font-size:.58rem;font-weight:800;color:#ffffff4d;
  text-align:center;line-height:1.15;padding:2px;
}
.slot.on{border-style:solid;border-color:transparent;color:#fff}
.track.lib .slot.on{background:linear-gradient(160deg,#3b82f6,#1d4ed8);box-shadow:0 3px 10px #3b82f650}
.track.fas .slot.on{background:linear-gradient(160deg,#dc2626,#7f1d1d);box-shadow:0 3px 10px #dc262650}

.tracker{display:flex;align-items:center;gap:9px;justify-content:center;padding:2px 0}
.tracker-lbl{font-size:.7rem;font-weight:800;color:var(--muted)}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.on{background:var(--gold);border-color:var(--gold)}

/* ── PLAYERS ── */
.plist{display:flex;flex-wrap:wrap;gap:7px}
.ptag{
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:7px 11px;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px;
}
.ptag.dead{opacity:.4;text-decoration:line-through}
.ptag .role-badge{font-size:.62rem;font-weight:900;padding:1px 6px;border-radius:6px;background:var(--gold);color:#1a1204}
.ptag.pres{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ptag.chan{border-color:#93c5fd;box-shadow:0 0 0 1px #93c5fd inset}

/* ── HANDOFF ── */
.handoff{text-align:center;display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.handoff .who{font-size:2rem;font-weight:900;line-height:1.2}
.handoff .lead{font-size:.95rem;color:var(--muted)}
.handoff .icon{font-size:3rem}

/* ── ROLE CARD ── */
.role-card{border-radius:20px;padding:26px 20px;text-align:center;border:2px solid}
.role-card.lib{background:linear-gradient(170deg,#12294d,#0c1a2e);border-color:var(--lib)}
.role-card.fas{background:linear-gradient(170deg,#3d1111,#220a0a);border-color:var(--fas)}
.role-card .r-lbl{font-size:.72rem;font-weight:800;letter-spacing:2px;color:var(--muted)}
.role-card .r-name{font-size:2.2rem;font-weight:900;margin:6px 0 4px}
.role-card.lib .r-name{color:#93c5fd}
.role-card.fas .r-name{color:#fca5a5}
.role-card .r-desc{font-size:.86rem;color:#cbd5e1;line-height:1.7;margin-top:10px}
.team-box{margin-top:14px;background:#00000040;border-radius:12px;padding:12px}
.team-box .t-lbl{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
.team-box .t-names{font-size:.95rem;font-weight:800;line-height:1.7}

/* ── POLICY CARDS ── */
.pol-row{display:flex;gap:10px;justify-content:center}
.pol{
  flex:1;max-width:150px;aspect-ratio:.7;border-radius:14px;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-weight:900;text-align:center;padding:8px;transition:transform .1s;
}
.pol:active{transform:scale(.96)}
.pol.sel{outline:3px solid var(--gold);outline-offset:3px}
.pol.dim{opacity:.4}
.pol.L{background:linear-gradient(165deg,#3b82f6,#1e40af);color:#fff}
.pol.F{background:linear-gradient(165deg,#dc2626,#7f1d1d);color:#fff}
.pol .p-name{font-size:1rem}
.pol .p-act{font-size:.7rem;font-weight:800;opacity:.85;background:#00000040;padding:3px 8px;border-radius:7px}
.pol .p-ico{font-size:1.7rem}

/* ── VOTE ── */
.vote-row{display:flex;gap:12px}
.vote-btn{flex:1;padding:26px 10px;border-radius:18px;font-size:1.5rem;font-weight:900;color:#fff}
.vote-btn.ja{background:linear-gradient(160deg,#22c55e,#15803d)}
.vote-btn.nein{background:linear-gradient(160deg,#ef4444,#991b1b)}
.vote-list{display:flex;flex-direction:column;gap:7px}
.vote-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:11px;padding:10px 13px;font-weight:700;font-size:.9rem}
.v-ja{color:#4ade80;font-weight:900}
.v-nein{color:#f87171;font-weight:900}

/* ── BANNERS ── */
.banner{border-radius:16px;padding:18px;text-align:center;font-weight:900;font-size:1.15rem;line-height:1.5}
.banner.lib{background:linear-gradient(160deg,#1d4ed8,#0f2f6b);color:#fff}
.banner.fas{background:linear-gradient(160deg,#b91c1c,#5c1010);color:#fff}
.banner.neutral{background:var(--surface2);color:var(--text)}
.banner .b-sub{font-size:.82rem;font-weight:700;opacity:.85;margin-top:7px}

.chip-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:700;color:var(--muted)}
.chip b{color:var(--text)}

/* ── SELECT LIST ── */
.sel-list{display:flex;flex-direction:column;gap:9px}
.sel{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface2);border:1px solid var(--line);border-radius:13px;
  padding:15px 15px;font-size:1rem;font-weight:800;width:100%;text-align:right;
}
.sel:active{transform:scale(.99)}
.sel .why{font-size:.72rem;font-weight:700;color:var(--muted)}
.sel[disabled]{opacity:.38;pointer-events:none}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h2{font-size:1.05rem;font-weight:900}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1rem}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:#000000cc;backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:540px;max-height:82dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
.sheet h3{font-size:1.05rem;font-weight:900;margin-bottom:12px}
.log-list{display:flex;flex-direction:column-reverse;gap:7px;margin-bottom:14px}
.log-item{background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:.83rem;line-height:1.5}
.log-item .rnd{font-size:.68rem;font-weight:900;color:var(--muted);margin-left:6px}
.rules-h{font-size:.86rem;font-weight:900;color:var(--gold);margin:14px 0 5px}
.rules-p{font-size:.82rem;color:#cbd5e1;line-height:1.75}
.rules-p b{color:#fff}
ul.rules-ul{padding-inline-start:18px;font-size:.82rem;color:#cbd5e1;line-height:1.8}

.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══ מסכים של גרסת הרשת ══ */
.code-box{
  background:linear-gradient(160deg,#1e2430,#141922);border:2px solid var(--gold);
  border-radius:18px;padding:18px;text-align:center;
}
.code-box .c-lbl{font-size:.7rem;font-weight:800;letter-spacing:2px;color:var(--muted)}
.code-box .c-val{font-size:3rem;font-weight:900;letter-spacing:10px;color:var(--gold);direction:ltr;margin:4px 0}
.code-box .c-hint{font-size:.78rem;color:var(--muted);line-height:1.6}

.code-inp{
  width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;
  color:var(--text);font-size:2rem;font-weight:900;letter-spacing:12px;direction:ltr;
  text-align:center;padding:14px;outline:none;
}
.code-inp:focus{border-color:var(--gold)}

.wait-box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:14px 0}
.wait-box .w-who{font-size:1.4rem;font-weight:900}
.wait-box .w-what{font-size:.9rem;color:var(--muted);line-height:1.6}
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--gold);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.fade{animation:none}}

.ptag .conn{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px}
.ptag .conn.off{background:#ef4444}
.ptag.me{border-color:var(--gold)}

.status-bar{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:.72rem;font-weight:700;color:var(--muted);
}
.status-bar .conn{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status-bar .conn.off{background:#ef4444}
.you-are{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;
}
.you-are .ya-lbl{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:1px}
.you-are .ya-val{font-size:.92rem;font-weight:900}
.you-are .ya-val.lib{color:#93c5fd}
.you-are .ya-val.fas{color:#fca5a5}
.voted-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.voted-chip{background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:.76rem;font-weight:700;color:var(--muted)}
.voted-chip.done{background:#14331f;color:#86efac}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   סיקרט היטלר — אונליין. כל שחקן מהטלפון שלו.
   מי שפותח את החדר הוא ה"מארח": המכשיר שלו מנהל את המשחק,
   והשאר מתחברים אליו ישירות (WebRTC) עם קוד בן 4 ספרות.
   ══════════════════════════════════════════════════════════════ */

const app = document.getElementById('app');

/* ── טעינת ספריית החיבור, עם מקורות גיבוי ── */
const PEER_SRCS = [
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
];
function loadPeer() {
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (window.Peer) return resolve(window.Peer);
      if (i >= PEER_SRCS.length) return reject(new Error('no-peer-lib'));
      const s = document.createElement('script');
      s.src = PEER_SRCS[i++];
      s.async = true;
      s.onload = () => (window.Peer ? resolve(window.Peer) : tryNext());
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}

/* ── עזרים ── */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const uid = () => 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ══════════════ חוקי המשחק ══════════════ */

const SETUP = {
  5:  { fascists: 1, hitlerKnows: true  },
  6:  { fascists: 1, hitlerKnows: true  },
  7:  { fascists: 2, hitlerKnows: false },
  8:  { fascists: 2, hitlerKnows: false },
  9:  { fascists: 3, hitlerKnows: false },
  10: { fascists: 3, hitlerKnows: false },
};
const POWERS = {
  5:  [null, null, 'peek', 'kill', 'kill'],
  6:  [null, null, 'peek', 'kill', 'kill'],
  7:  [null, 'investigate', 'special', 'kill', 'kill'],
  8:  [null, 'investigate', 'special', 'kill', 'kill'],
  9:  ['investigate', 'investigate', 'special', 'kill', 'kill'],
  10: ['investigate', 'investigate', 'special', 'kill', 'kill'],
};
const POWER_INFO = {
  peek:        { name: 'הצצה במדיניות', icon: '🔮', desc: 'הנשיא מציץ בשלושת הקלפים העליונים בחפיסה.' },
  investigate: { name: 'חקירת נאמנות',  icon: '🔍', desc: 'הנשיא בוחר שחקן ורואה את השתייכותו המפלגתית.' },
  special:     { name: 'בחירות מיוחדות', icon: '🗳️', desc: 'הנשיא בוחר מי יהיה הנשיא בסבב הבא (חד־פעמי).' },
  kill:        { name: 'הוצאה להורג',   icon: '💀', desc: 'הנשיא בוחר שחקן שיוצא מהמשחק.' },
};

/* ══════════════ המנוע — רץ רק אצל המארח ══════════════ */

function glog(G, text) { G.log.push({ r: G.round, text }); if (G.log.length > 120) G.log.shift(); }
const iOf = (G, pid) => G.players.findIndex(p => p.id === pid);
const nameOf = (G, i) => (i == null || i < 0 ? '—' : G.players[i].name);
const aliveCount = G => G.players.filter(p => p.alive).length;

function createGame(players, hostId) {
  const n = players.length;
  const conf = SETUP[n];
  const roles = [];
  for (let i = 0; i < conf.fascists; i++) roles.push('fascist');
  roles.push('hitler');
  while (roles.length < n) roles.push('liberal');
  shuffle(roles);

  const G = {
    hostId,
    boardSize: n,
    hitlerKnows: conf.hitlerKnows,
    players: players.map((p, i) => ({ id: p.id, name: p.name, role: roles[i], alive: true, connected: true })),
    deck: shuffle(Array(6).fill('L').concat(Array(11).fill('F'))),
    discard: [],
    lib: 0, fas: 0, tracker: 0, round: 1,
    presIdx: 0, regularIdx: 0, inSpecial: false, pendingSpecial: null,
    chanIdx: null, lastPres: null, lastChan: null,
    ready: {}, votes: {},
    drawn: [], chanCards: [],
    veto: false, vetoAsked: false,
    investigated: [], powerKind: null, powerStage: null, powerTarget: null,
    winner: null, winReason: '',
    log: [], phase: 'roles',
  };
  glog(G, 'המשחק התחיל — ' + n + ' שחקנים: ' + conf.fascists + ' פשיסטים והיטלר מול ' + (n - conf.fascists - 1) + ' ליברלים');
  return G;
}

function nextAliveAfter(G, i) {
  let j = i;
  for (let k = 0; k < G.players.length; k++) {
    j = (j + 1) % G.players.length;
    if (G.players[j].alive) return j;
  }
  return i;
}

function eligibleChancellor(G, i) {
  if (i == null || i < 0 || i >= G.players.length) return false;
  if (i === G.presIdx || !G.players[i].alive) return false;
  if (i === G.lastChan) return false;
  if (i === G.lastPres && aliveCount(G) > 5) return false;
  return true;
}

function ensureDeck(G, n) {
  if (G.deck.length < n) {
    G.deck = shuffle(G.deck.concat(G.discard));
    G.discard = [];
    glog(G, 'החפיסה נגמרה — הקלפים שהושלכו עורבבו מחדש');
  }
}

function startRound(G) {
  if (G.pendingSpecial !== null) {
    G.presIdx = G.pendingSpecial;
    G.pendingSpecial = null;
    G.inSpecial = true;
    glog(G, 'בחירות מיוחדות: ' + nameOf(G, G.presIdx) + ' מונה לנשיא');
  } else {
    if (G.inSpecial) G.inSpecial = false;
    G.regularIdx = nextAliveAfter(G, G.regularIdx);
    G.presIdx = G.regularIdx;
  }
  G.chanIdx = null;
  G.votes = {};
  G.drawn = []; G.chanCards = [];
  G.vetoAsked = false;
  G.powerKind = null; G.powerStage = null; G.powerTarget = null;
  G.phase = 'nominate';
}

function endGame(G, winner, reason) {
  G.winner = winner;
  G.winReason = reason;
  G.phase = 'gameover';
  glog(G, 'סוף המשחק — ' + (winner === 'liberal' ? 'הליברלים ניצחו' : 'הפשיסטים ניצחו') + ': ' + reason);
}

function enact(G, card, byChaos) {
  if (card === 'L') G.lib++; else G.fas++;
  G.tracker = 0;
  glog(G, 'הועברה מדיניות ' + (card === 'L' ? 'ליברלית' : 'פשיסטית') + ' (ליברלים ' + G.lib + ', פשיסטים ' + G.fas + ')');
  if (!G.veto && G.fas >= 5) { G.veto = true; glog(G, 'כוח הווטו נפתח'); }
  G.lastEnacted = card;
  G.lastByChaos = !!byChaos;

  if (G.lib >= 5) return endGame(G, 'liberal', 'חמש מדיניות ליברליות הועברו');
  if (G.fas >= 6) return endGame(G, 'fascist', 'שש מדיניות פשיסטיות הועברו');

  G.powerKind = (!byChaos && card === 'F') ? (POWERS[G.boardSize][G.fas - 1] || null) : null;
  G.powerStage = G.powerKind ? 'select' : null;
  G.powerTarget = null;
  G.phase = 'enacted';
}

function chaos(G) {
  ensureDeck(G, 1);
  const card = G.deck.shift();
  G.lastPres = null;
  G.lastChan = null;
  glog(G, 'שלוש הצבעות נכשלו ברצף — כאוס! המדיניות העליונה מועברת אוטומטית');
  enact(G, card, true);
}

function resolveVote(G) {
  const voters = G.players.filter(p => p.alive);
  const ja = voters.filter(p => G.votes[p.id] === true).length;
  const passed = ja * 2 > voters.length;
  G.votePassed = passed;
  G.phase = 'voteResult';
  glog(G, passed
    ? 'ההצבעה עברה — ' + nameOf(G, G.presIdx) + ' (נשיא) ו-' + nameOf(G, G.chanIdx) + ' (קנצלר)'
    : 'ההצבעה נכשלה');
}

function afterVoteResult(G) {
  if (G.votePassed) {
    G.lastPres = G.presIdx;
    G.lastChan = G.chanIdx;
    if (G.fas >= 3 && G.players[G.chanIdx].role === 'hitler') {
      return endGame(G, 'fascist', 'היטלר נבחר לקנצלר אחרי שלוש מדיניות פשיסטיות');
    }
    ensureDeck(G, 3);
    G.drawn = [G.deck.shift(), G.deck.shift(), G.deck.shift()];
    G.phase = 'presDraw';
  } else {
    G.tracker++;
    if (G.tracker >= 3) return chaos(G);
    G.round++;
    startRound(G);
  }
}

function afterEnacted(G) {
  if (G.powerKind) {
    if (G.powerKind === 'peek') { ensureDeck(G, 3); G.powerStage = 'result'; }
    G.phase = 'power';
  } else {
    G.round++;
    startRound(G);
  }
}

function usePower(G, target) {
  const k = G.powerKind;
  G.powerTarget = target;
  if (k === 'investigate') {
    G.investigated.push(target);
    glog(G, nameOf(G, G.presIdx) + ' חוקר את נאמנותו של ' + nameOf(G, target));
  } else if (k === 'special') {
    G.pendingSpecial = target;
    glog(G, nameOf(G, G.presIdx) + ' מכריז על בחירות מיוחדות: ' + nameOf(G, target));
  } else if (k === 'kill') {
    G.players[target].alive = false;
    glog(G, nameOf(G, G.presIdx) + ' הוציא להורג את ' + nameOf(G, target));
    if (G.players[target].role === 'hitler') {
      G.powerStage = 'result';
      return endGame(G, 'liberal', 'היטלר הוצא להורג');
    }
  }
  G.powerStage = 'result';
}

function validTarget(G, t) {
  if (t == null || t < 0 || t >= G.players.length) return false;
  if (!G.players[t].alive || t === G.presIdx) return false;
  if (G.powerKind === 'investigate' && G.investigated.includes(t)) return false;
  return true;
}

/* פעולה שהגיעה משחקן. מחזיר true אם המצב השתנה. */
function applyAction(G, pid, act) {
  const i = iOf(G, pid);
  if (i < 0 || !act || typeof act.a !== 'string') return false;
  const isPres = i === G.presIdx;
  const isChan = i === G.chanIdx;

  switch (G.phase) {
    case 'roles':
      if (act.a === 'ready') {
        if (G.ready[pid]) return false;
        G.ready[pid] = true;
        if (G.players.every(p => G.ready[p.id])) {
          G.presIdx = 0; G.regularIdx = 0;
          G.phase = 'nominate';
          glog(G, nameOf(G, 0) + ' פותח כנשיא הראשון');
        }
        return true;
      }
      return false;

    case 'nominate':
      if (act.a === 'nominate' && isPres && eligibleChancellor(G, act.i)) {
        G.chanIdx = act.i;
        G.votes = {};
        G.phase = 'vote';
        glog(G, 'סבב ' + G.round + ': ' + nameOf(G, G.presIdx) + ' מציע את ' + nameOf(G, act.i) + ' לקנצלר');
        return true;
      }
      return false;

    case 'vote': {
      const pending = () => G.players.filter(p => p.alive).every(p => p.id in G.votes);
      if (act.a === 'vote' && G.players[i].alive && !(pid in G.votes)) {
        G.votes[pid] = !!act.v;
        if (pending()) resolveVote(G);
        return true;
      }
      if (act.a === 'skipDisconnected' && pid === G.hostId) {
        let changed = false;
        G.players.forEach(p => {
          if (p.alive && !p.connected && !(p.id in G.votes)) { G.votes[p.id] = false; changed = true; }
        });
        if (changed) {
          glog(G, 'המארח סימן "לא" עבור שחקנים מנותקים');
          if (pending()) resolveVote(G);
        }
        return changed;
      }
      return false;
    }

    case 'voteResult':
      if (act.a === 'continue' && isPres) { afterVoteResult(G); return true; }
      return false;

    case 'presDraw':
      if (act.a === 'discard' && isPres && G.drawn.length === 3 && act.i >= 0 && act.i < 3) {
        G.discard.push(G.drawn[act.i]);
        G.chanCards = G.drawn.filter((_, k) => k !== act.i);
        G.drawn = [];
        G.phase = 'chanDraw';
        return true;
      }
      return false;

    case 'chanDraw':
      if (act.a === 'enact' && isChan && G.chanCards.length === 2 && act.i >= 0 && act.i < 2) {
        const chosen = G.chanCards[act.i];
        G.chanCards.forEach((c, k) => { if (k !== act.i) G.discard.push(c); });
        G.chanCards = [];
        enact(G, chosen, false);
        return true;
      }
      if (act.a === 'veto' && isChan && G.veto && !G.vetoAsked) {
        G.phase = 'vetoAsk';
        glog(G, nameOf(G, G.chanIdx) + ' מבקש וטו');
        return true;
      }
      return false;

    case 'vetoAsk':
      if (act.a === 'vetoYes' && isPres) {
        G.chanCards.forEach(c => G.discard.push(c));
        G.chanCards = [];
        glog(G, 'הווטו אושר — לא הועברה מדיניות');
        G.tracker++;
        if (G.tracker >= 3) chaos(G); else { G.round++; startRound(G); }
        return true;
      }
      if (act.a === 'vetoNo' && isPres) {
        G.vetoAsked = true;
        G.phase = 'chanDraw';
        glog(G, nameOf(G, G.presIdx) + ' דחה את בקשת הווטו');
        return true;
      }
      return false;

    case 'enacted':
      if (act.a === 'continue' && isPres) { afterEnacted(G); return true; }
      return false;

    case 'power':
      if (act.a === 'power' && isPres && G.powerStage === 'select' && validTarget(G, act.i)) {
        usePower(G, act.i);
        return true;
      }
      if (act.a === 'continue' && isPres && G.powerStage === 'result' && G.phase !== 'gameover') {
        G.round++;
        startRound(G);
        return true;
      }
      return false;
  }
  return false;
}

/* ══════════════ מה כל שחקן רואה ══════════════ */

function teamFor(G, i) {
  const me = G.players[i];
  if (me.role === 'liberal') return null;
  if (me.role === 'hitler' && !G.hitlerKnows) return null;
  return G.players
    .map((p, k) => ({ p, k }))
    .filter(o => o.k !== i && (o.p.role === 'fascist' || o.p.role === 'hitler'))
    .map(o => ({ name: o.p.name, hitler: o.p.role === 'hitler' }));
}

function waitingNames(G) {
  if (G.phase === 'roles') return G.players.filter(p => !G.ready[p.id]).map(p => p.name);
  if (G.phase === 'vote') return G.players.filter(p => p.alive && !(p.id in G.votes)).map(p => p.name);
  if (G.phase === 'chanDraw') return [nameOf(G, G.chanIdx)];
  return [nameOf(G, G.presIdx)];
}

function viewFor(G, pid) {
  const i = iOf(G, pid);
  if (i < 0) return null;
  const me = G.players[i];
  const isPres = i === G.presIdx;
  const isChan = i === G.chanIdx;

  const v = {
    phase: G.phase,
    round: G.round,
    boardSize: G.boardSize,
    lib: G.lib, fas: G.fas, tracker: G.tracker,
    deckCount: G.deck.length, discardCount: G.discard.length, vetoOpen: G.veto,
    presName: nameOf(G, G.presIdx),
    chanName: G.chanIdx == null ? null : nameOf(G, G.chanIdx),
    players: G.players.map((p, k) => ({
      name: p.name, alive: p.alive, connected: p.connected,
      pres: k === G.presIdx, chan: k === G.chanIdx, me: k === i,
    })),
    me: { name: me.name, alive: me.alive, role: me.role, team: teamFor(G, i) },
    isHost: pid === G.hostId, isPres, isChan,
    hostName: (G.players.find(p => p.id === G.hostId) || {}).name || '',
    waiting: waitingNames(G),
    log: G.log.slice(-30),
  };

  if (G.phase === 'roles') {
    v.ready = G.ready[pid] === true;
    v.readyCount = G.players.filter(p => G.ready[p.id]).length;
  }

  if (G.phase === 'nominate' && isPres) {
    v.candidates = G.players.map((p, k) => {
      let why = '';
      if (k === G.presIdx) why = 'הנשיא הנוכחי';
      else if (k === G.lastChan) why = 'כיהן כקנצלר בממשלה האחרונה';
      else if (k === G.lastPres && aliveCount(G) > 5) why = 'כיהן כנשיא בממשלה האחרונה';
      return { i: k, name: p.name, why, ok: eligibleChancellor(G, k), alive: p.alive };
    }).filter(c => c.alive);
  }

  if (G.phase === 'vote') {
    v.myVote = pid in G.votes ? G.votes[pid] : null;
    v.voted = G.players.filter(p => p.alive).map(p => ({ name: p.name, done: p.id in G.votes }));
    v.anyDisconnected = G.players.some(p => p.alive && !p.connected && !(p.id in G.votes));
  }

  if (G.phase === 'voteResult') {
    v.passed = G.votePassed;
    v.votes = G.players.filter(p => p.alive).map(p => ({ name: p.name, v: G.votes[p.id] === true }));
    v.chaosNext = !G.votePassed && G.tracker === 2;
  }

  if (G.phase === 'presDraw' && isPres) v.cards = G.drawn.slice();
  if (G.phase === 'chanDraw' && isChan) { v.cards = G.chanCards.slice(); v.canVeto = G.veto && !G.vetoAsked; v.vetoRefused = G.vetoAsked; }
  if (G.phase === 'vetoAsk' && isPres) v.vetoFrom = nameOf(G, G.chanIdx);

  if (G.phase === 'enacted') {
    v.enacted = G.lastEnacted;
    v.byChaos = G.lastByChaos;
    v.power = G.powerKind;
  }

  if (G.phase === 'power') {
    v.power = G.powerKind;
    v.stage = G.powerStage;
    if (G.powerStage === 'select' && isPres) {
      v.targets = G.players.map((p, k) => {
        let why = '';
        if (k === G.presIdx) why = 'זה אתה';
        else if (G.powerKind === 'investigate' && G.investigated.includes(k)) why = 'כבר נחקר בעבר';
        return { i: k, name: p.name, why, ok: validTarget(G, k), alive: p.alive };
      }).filter(t => t.alive);
    }
    if (G.powerStage === 'result') {
      if (G.powerKind === 'peek') { if (isPres) v.peek = G.deck.slice(0, 3); }
      else if (G.powerKind === 'investigate') {
        v.targetName = nameOf(G, G.powerTarget);
        if (isPres) v.loyalty = G.players[G.powerTarget].role === 'liberal' ? 'liberal' : 'fascist';
      } else {
        v.targetName = nameOf(G, G.powerTarget);
      }
    }
  }

  if (G.phase === 'gameover') {
    v.winner = G.winner;
    v.winReason = G.winReason;
    v.reveal = G.players.map(p => ({ name: p.name, role: p.role, alive: p.alive }));
  }

  return v;
}

/* ══════════════ תצוגה (טהורה: view → HTML) ══════════════ */

const UI = { sheet: null, showRole: false, pending: null, net: 'connecting' };

function boardBox(v) {
  const powers = POWERS[v.boardSize] || POWERS[7];
  const libSlots = Array.from({ length: 5 }, (_, i) =>
    '<div class="slot' + (i < v.lib ? ' on' : '') + '">' + (i === 4 ? 'ניצחון' : '') + '</div>').join('');
  const fasSlots = Array.from({ length: 6 }, (_, i) => {
    const pw = powers[i];
    return '<div class="slot' + (i < v.fas ? ' on' : '') + '">' + (i === 5 ? 'ניצחון' : (pw ? POWER_INFO[pw].icon : '')) + '</div>';
  }).join('');
  const dots = [0, 1, 2].map(i => '<div class="dot' + (i < v.tracker ? ' on' : '') + '"></div>').join('');
  return '<div class="board">' +
    '<div class="track lib"><div class="track-head"><span class="track-name">ליברלים</span>' +
      '<span class="track-count" dir="ltr">' + v.lib + ' / 5</span></div><div class="slots">' + libSlots + '</div></div>' +
    '<div class="track fas"><div class="track-head"><span class="track-name">פשיסטים</span>' +
      '<span class="track-count" dir="ltr">' + v.fas + ' / 6</span></div><div class="slots">' + fasSlots + '</div></div>' +
    '<div class="tracker"><span class="tracker-lbl">מד בחירות כושלות</span>' + dots + '</div>' +
  '</div>';
}

function playersBox(v) {
  return '<div class="plist">' + v.players.map(p => {
    const cls = ['ptag'];
    if (!p.alive) cls.push('dead');
    if (p.pres && p.alive) cls.push('pres');
    if (p.chan && p.alive) cls.push('chan');
    if (p.me) cls.push('me');
    let badge = '';
    if (p.pres && p.alive) badge = '<span class="role-badge">נשיא</span>';
    else if (p.chan && p.alive) badge = '<span class="role-badge" style="background:#93c5fd">קנצלר</span>';
    return '<div class="' + cls.join(' ') + '">' +
      '<span class="conn' + (p.connected ? '' : ' off') + '"></span>' +
      esc(p.name) + (p.me ? ' (את/ה)' : '') + badge + '</div>';
  }).join('') + '</div>';
}

function roleStrip(v) {
  const r = v.me.role;
  const label = r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  return '<button class="you-are" data-act="toggleRole">' +
    '<span class="ya-lbl">התפקיד שלי</span>' +
    (UI.showRole
      ? '<span class="ya-val ' + (r === 'liberal' ? 'lib' : 'fas') + '">' + label +
        (v.me.team && v.me.team.length ? ' · צוות: ' + v.me.team.map(t => esc(t.name) + (t.hitler ? ' (היטלר)' : '')).join(', ') : '') +
        '</span>'
      : '<span class="ya-val" style="color:var(--muted)">הקש להצגה 👁</span>') +
  '</button>';
}

function topbar(title) {
  return '<div class="topbar"><h2>' + title + '</h2>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="icon-btn" data-act="sheet" data-v="rules" aria-label="חוקים">📖</button>' +
      '<button class="icon-btn" data-act="sheet" data-v="log" aria-label="יומן">🗒️</button>' +
    '</div></div>';
}

function waitBox(names, what) {
  const who = names.length > 2 ? names.length + ' שחקנים' : names.map(esc).join(' ו־');
  return '<div class="card"><div class="wait-box">' +
    '<div class="spinner"></div>' +
    '<div class="w-who">' + who + '</div>' +
    '<div class="w-what">' + what + '</div>' +
  '</div></div>';
}

function policyCard(card, action, idx, sub, state) {
  const isL = card === 'L';
  const cls = 'pol ' + card + (state === 'sel' ? ' sel' : (state === 'dim' ? ' dim' : ''));
  return '<button class="' + cls + '"' + (action ? ' data-act="' + action + '" data-i="' + idx + '"' : '') + '>' +
    '<span class="p-ico">' + (isL ? '🕊️' : '🔥') + '</span>' +
    '<span class="p-name">' + (isL ? 'ליברלית' : 'פשיסטית') + '</span>' +
    (sub ? '<span class="p-act">' + sub + '</span>' : '') + '</button>';
}

function selList(items, action) {
  return '<div class="sel-list">' + items.map(it =>
    '<button class="sel" style="text-align:right' +
      (UI.pending === it.i ? ';border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset' : '') + '"' +
      ' data-act="' + action + '" data-i="' + it.i + '"' + (it.ok ? '' : ' disabled') + '>' +
      '<span>' + esc(it.name) + '</span><span class="why">' + esc(it.why || '') + '</span></button>').join('') + '</div>';
}

/* ── מסך המשחק, לפי השלב ── */
function renderGame(v) {
  const head = topbar('סבב ' + v.round) + boardBox(v) + playersBox(v) + roleStrip(v);
  const P = v.power ? POWER_INFO[v.power] : null;
  let body = '';

  switch (v.phase) {

    case 'nominate':
      body = v.isPres
        ? '<div class="card"><h2 class="card-t">🗳️ אתם הנשיא</h2>' +
            '<p class="hint" style="margin-bottom:12px">בחרו מועמד לקנצלר. אחר כך כולם יצביעו מהטלפון שלהם.</p>' +
            selList(v.candidates, 'nominate') + '</div>'
        : waitBox([v.presName], 'הנשיא בוחר מועמד לקנצלר');
      break;

    case 'vote':
      if (v.myVote === null && v.me.alive) {
        body = '<div class="card">' +
          '<div class="banner neutral" style="margin-bottom:14px">נשיא: <b>' + esc(v.presName) + '</b><br>קנצלר מוצע: <b>' + esc(v.chanName) + '</b>' +
            '<div class="b-sub">מאשרים את הממשלה הזו?</div></div>' +
          '<div class="vote-row">' +
            '<button class="vote-btn ja" data-act="vote" data-v="1">כן<br><span style="font-size:.8rem;opacity:.8">JA</span></button>' +
            '<button class="vote-btn nein" data-act="vote" data-v="0">לא<br><span style="font-size:.8rem;opacity:.8">NEIN</span></button>' +
          '</div><p class="hint" style="text-align:center;margin-top:10px">ההצבעה חשאית ותיחשף רק כשכולם יצביעו.</p></div>';
      } else {
        body = '<div class="card">' +
          '<p class="hint" style="text-align:center;margin-bottom:12px">' +
            (v.me.alive ? 'הצבעת <b>' + (v.myVote ? 'כן' : 'לא') + '</b>. ממתינים לשאר.' : 'אתם מחוץ למשחק ואינכם מצביעים.') + '</p>' +
          '<div class="voted-list">' + v.voted.map(x =>
            '<span class="voted-chip' + (x.done ? ' done' : '') + '">' + (x.done ? '✓ ' : '') + esc(x.name) + '</span>').join('') + '</div>' +
          (v.isHost && v.anyDisconnected
            ? '<button class="btn btn-ghost btn-sm" style="margin-top:14px" data-act="skipDisconnected">סמן "לא" עבור המנותקים</button>' : '') +
        '</div>';
      }
      break;

    case 'voteResult': {
      const ja = v.votes.filter(x => x.v).length;
      body = '<div class="banner ' + (v.passed ? 'lib' : '') + '"' + (v.passed ? '' : ' style="background:linear-gradient(160deg,#4b5563,#1f2937)"') + '>' +
          (v.passed ? '✅ הממשלה אושרה' : '❌ הממשלה נדחתה') +
          '<div class="b-sub"><bdi>' + ja + ' בעד</bdi> • <bdi>' + (v.votes.length - ja) + ' נגד</bdi></div></div>' +
        '<div class="card"><div class="vote-list">' + v.votes.map(x =>
          '<div class="vote-item"><span>' + esc(x.name) + '</span><span class="' + (x.v ? 'v-ja' : 'v-nein') + '">' +
          (x.v ? 'כן' : 'לא') + '</span></div>').join('') + '</div></div>' +
        (v.chaosNext ? '<p class="hint" style="text-align:center;color:#fca5a5">זו ההצבעה הכושלת השלישית ברצף — כאוס: המדיניות העליונה תעבור אוטומטית.</p>' : '') +
        (v.isPres
          ? '<button class="btn btn-primary" data-act="continue">' + (v.passed ? 'המשך למליאה' : 'המשך') + '</button>'
          : waitBox([v.presName], 'ממתינים שהנשיא ימשיך'));
      break;
    }

    case 'presDraw':
      body = v.isPres
        ? '<div class="card"><h2 class="card-t">🗂️ השליכו קלף אחד</h2>' +
            '<p class="hint" style="margin-bottom:14px">שני הנותרים יעברו לקנצלר ' + esc(v.chanName) + '.</p>' +
            '<div class="pol-row">' + v.cards.map((c, i) =>
              policyCard(c, 'pick', i, 'השלך', UI.pending == null ? null : (UI.pending === i ? 'sel' : 'dim'))).join('') + '</div></div>' +
          (UI.pending != null
            ? '<div class="card" style="border-color:var(--gold)"><p class="hint" style="margin-bottom:10px;text-align:center">להשליך מדיניות <b>' +
              (v.cards[UI.pending] === 'L' ? 'ליברלית' : 'פשיסטית') + '</b>?</p><div class="btn-row">' +
              '<button class="btn btn-sm btn-primary" data-act="discard" data-i="' + UI.pending + '">כן, השלך</button>' +
              '<button class="btn btn-sm btn-ghost" data-act="cancel">ביטול</button></div></div>' : '')
        : waitBox([v.presName], 'הנשיא מקבל שלושה קלפים ומשליך אחד');
      break;

    case 'chanDraw':
      body = v.isChan
        ? '<div class="card"><h2 class="card-t">⚖️ בחרו מדיניות להעברה</h2>' +
            '<p class="hint" style="margin-bottom:14px">הקלף שתבחרו יועבר בפומבי. השני יושלך.</p>' +
            '<div class="pol-row">' + v.cards.map((c, i) =>
              policyCard(c, 'pick', i, 'העבר', UI.pending == null ? null : (UI.pending === i ? 'sel' : 'dim'))).join('') + '</div></div>' +
          (UI.pending != null
            ? '<div class="card" style="border-color:var(--gold)"><p class="hint" style="margin-bottom:10px;text-align:center">להעביר מדיניות <b>' +
              (v.cards[UI.pending] === 'L' ? 'ליברלית' : 'פשיסטית') + '</b>?</p><div class="btn-row">' +
              '<button class="btn btn-sm btn-primary" data-act="enact" data-i="' + UI.pending + '">כן, העבר</button>' +
              '<button class="btn btn-sm btn-ghost" data-act="cancel">ביטול</button></div></div>'
            : (v.canVeto ? '<button class="btn btn-ghost" data-act="veto">🚫 בקשת וטו</button>' : '')) +
          (v.vetoRefused ? '<p class="hint" style="text-align:center;color:#fca5a5">הנשיא דחה את הווטו — חובה להעביר מדיניות.</p>' : '')
        : waitBox([v.chanName], 'הקנצלר בוחר איזו מדיניות להעביר');
      break;

    case 'vetoAsk':
      body = v.isPres
        ? '<div class="banner neutral">🚫 הקנצלר ' + esc(v.vetoFrom) + ' מבקש לבטל את שתי המדיניות' +
            '<div class="b-sub">אם תסכימו — לא תועבר מדיניות, ומד הבחירות הכושלות יעלה באחד.</div></div>' +
          '<button class="btn btn-fas" data-act="vetoYes">מסכים לווטו</button>' +
          '<button class="btn" data-act="vetoNo">מסרב — שיעביר מדיניות</button>'
        : waitBox([v.presName], 'הקנצלר ביקש וטו — הנשיא מחליט');
      break;

    case 'enacted':
      body = '<div class="banner ' + (v.enacted === 'L' ? 'lib' : 'fas') + '">' +
          (v.enacted === 'L' ? '🕊️ הועברה מדיניות ליברלית' : '🔥 הועברה מדיניות פשיסטית') +
          '<div class="b-sub">' + (v.byChaos ? 'כאוס — המדיניות העליונה הועברה אוטומטית'
            : 'נשיא ' + esc(v.presName) + ' • קנצלר ' + esc(v.chanName)) + '</div></div>' +
        (P ? '<div class="card"><h2 class="card-t">' + P.icon + ' כוח נשיאותי: ' + P.name + '</h2><p class="hint">' + P.desc + '</p></div>' : '') +
        (v.isPres
          ? '<button class="btn btn-primary" data-act="continue">' + (P ? 'המשך — הפעלת הכוח' : 'המשך לסבב הבא') + '</button>'
          : waitBox([v.presName], 'ממתינים שהנשיא ימשיך'));
      break;

    case 'power':
      if (v.stage === 'select') {
        body = v.isPres
          ? '<div class="card"><h2 class="card-t">' + P.icon + ' ' + P.name + '</h2>' +
              '<p class="hint" style="margin-bottom:12px">' + P.desc + '</p>' +
              selList(v.targets, v.power === 'kill' ? 'pickTarget' : 'power') + '</div>' +
            (v.power === 'kill' && UI.pending != null
              ? '<div class="card" style="border-color:var(--gold)"><p class="hint" style="margin-bottom:10px;text-align:center">להוציא להורג את <b>' +
                esc((v.targets.find(t => t.i === UI.pending) || {}).name || '') + '</b>? הפעולה בלתי הפיכה.</p><div class="btn-row">' +
                '<button class="btn btn-sm btn-fas" data-act="power" data-i="' + UI.pending + '">כן, הוצא להורג</button>' +
                '<button class="btn btn-sm btn-ghost" data-act="cancel">ביטול</button></div></div>' : '')
          : waitBox([v.presName], 'הנשיא מפעיל את הכוח: ' + P.name);
      } else if (v.power === 'peek') {
        body = v.isPres
          ? '<div class="card"><h2 class="card-t">🔮 שלושת הקלפים העליונים</h2>' +
              '<div class="pol-row">' + v.peek.map((c, i) => policyCard(c, null, i, ['הבא בתור', 'אחריו', 'שלישי'][i])).join('') + '</div></div>' +
            '<p class="hint" style="text-align:center">מותר לכם לשקר לגבי מה שראיתם.</p>' +
            '<button class="btn btn-primary" data-act="continue">סיימתי — המשך</button>'
          : waitBox([v.presName], 'הנשיא מציץ בשלושת הקלפים הבאים');
      } else if (v.power === 'investigate') {
        body = v.isPres
          ? '<div class="role-card ' + (v.loyalty === 'liberal' ? 'lib' : 'fas') + '">' +
              '<div class="r-lbl">השתייכות מפלגתית של</div>' +
              '<div class="r-name" style="font-size:1.4rem">' + esc(v.targetName) + '</div>' +
              '<div class="r-name">' + (v.loyalty === 'liberal' ? 'ליברל' : 'פשיסט') + '</div>' +
              '<div class="r-desc">זו המפלגה בלבד — היטלר נראה כאן כ"פשיסט".</div></div>' +
            '<p class="hint" style="text-align:center">מותר לכם לשקר לגבי מה שראיתם.</p>' +
            '<button class="btn btn-primary" data-act="continue">סיימתי — המשך</button>'
          : waitBox([v.presName], 'הנשיא חוקר את ' + esc(v.targetName));
      } else {
        const kill = v.power === 'kill';
        body = '<div class="banner ' + (kill ? 'fas' : 'neutral') + '">' +
            (kill ? '💀 ' + esc(v.targetName) + ' הוצא להורג' : '🗳️ ' + esc(v.targetName) + ' יהיה הנשיא בסבב הבא') +
            '<div class="b-sub">' + (kill ? 'השחקן יצא מהמשחק ואינו מצביע. אסור לו לחשוף את תפקידו.'
              : 'אחרי הסבב הזה הנשיאות חוזרת לסדר הרגיל.') + '</div></div>' +
          (v.isPres ? '<button class="btn btn-primary" data-act="continue">המשך לסבב הבא</button>'
                    : waitBox([v.presName], 'ממתינים שהנשיא ימשיך'));
      }
      break;
  }

  return '<div class="screen fade">' + head + body + '</div>';
}

function renderRoles(v) {
  const r = v.me.role;
  const isFas = r !== 'liberal';
  const roleName = r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  const desc = r === 'liberal'
    ? 'המטרה שלך: להעביר 5 מדיניות ליברליות, או להוציא להורג את היטלר. אינך יודע מי אף אחד.'
    : (r === 'hitler'
      ? 'המטרה שלך: להיראות ליברל. אם יועברו 3 מדיניות פשיסטיות ואז ייבחרו אותך לקנצלר — ניצחתם. אם יוציאו אותך להורג — הפסדתם.'
      : 'המטרה שלך: להעביר 6 מדיניות פשיסטיות, או להכניס את היטלר לקנצלרות אחרי 3 מדיניות פשיסטיות.');

  let team = '';
  if (v.me.team && v.me.team.length) {
    team = '<div class="team-box"><div class="t-lbl">' + (r === 'hitler' ? 'הפשיסט שלך' : 'הצוות שלך') + '</div>' +
      '<div class="t-names">' + v.me.team.map(t => esc(t.name) + (t.hitler ? ' — <span style="color:#fca5a5">היטלר</span>' : '')).join('<br>') + '</div></div>';
  } else if (r === 'hitler') {
    team = '<div class="team-box"><div class="t-lbl">הצוות שלך</div>' +
      '<div class="t-names" style="font-weight:700;font-size:.85rem;color:#cbd5e1">בהרכב הזה אינך יודע מי הפשיסטים — הם מכירים אותך ויגנו עליך.</div></div>';
  }

  return '<div class="screen fade">' +
    topbar('התפקיד שלך') +
    '<div class="role-card ' + (isFas ? 'fas' : 'lib') + '">' +
      '<div class="r-lbl">' + esc(v.me.name) + '</div>' +
      '<div class="r-name">' + roleName + '</div>' +
      '<div class="r-desc">' + desc + '</div>' + team +
    '</div>' +
    '<p class="hint" style="text-align:center">המסך הזה פרטי לך. אל תראה אותו לאף אחד.</p>' +
    (v.ready
      ? waitBox(v.waiting, 'ממתינים שכולם יאשרו שראו את התפקיד (' + v.readyCount + ' מתוך ' + v.players.length + ')')
      : '<button class="btn btn-primary" data-act="ready">ראיתי — אני מוכן</button>') +
  '</div>';
}

function renderGameOver(v) {
  const libWin = v.winner === 'liberal';
  const roleName = r => r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  return '<div class="screen fade">' +
    topbar('סוף המשחק') +
    '<div class="banner ' + (libWin ? 'lib' : 'fas') + '" style="padding:26px 18px;font-size:1.5rem">' +
      (libWin ? '🕊️ הליברלים ניצחו' : '🔥 הפשיסטים ניצחו') +
      '<div class="b-sub" style="font-size:.9rem">' + esc(v.winReason) + '</div></div>' +
    boardBox(v) +
    '<div class="card"><h2 class="card-t">חשיפת התפקידים</h2><div class="sel-list">' +
      v.reveal.map(p => '<div class="sel" style="pointer-events:none;border-color:' +
        (p.role === 'liberal' ? '#1d3a6b' : '#5c1b1b') + (p.alive ? '' : ';opacity:.55') + '">' +
        '<span>' + esc(p.name) + (p.alive ? '' : ' 💀') + '</span>' +
        '<span class="why" style="font-weight:900;color:' + (p.role === 'liberal' ? '#93c5fd' : '#fca5a5') + '">' +
        roleName(p.role) + '</span></div>').join('') +
    '</div></div>' +
    (v.isHost
      ? '<button class="btn btn-primary" data-act="restart">סיבוב נוסף עם אותם שחקנים</button>'
      : waitBox([v.hostName || v.presName], 'ממתינים שהמארח יתחיל סיבוב נוסף')) +
  '</div>';
}

function renderLobby(v) {
  const enough = v.players.length >= 5;
  return '<div class="screen fade">' +
    topbar('חדר משחק') +
    '<div class="code-box">' +
      '<div class="c-lbl">קוד החדר</div>' +
      '<div class="c-val">' + esc(v.code) + '</div>' +
      '<div class="c-hint">כל שחקן פותח את אותו קישור, בוחר "הצטרפות לחדר" ומקליד את הקוד.</div>' +
    '</div>' +
    '<button class="btn btn-sm btn-ghost" data-act="share">📎 העתקת הקישור לשליחה בוואטסאפ</button>' +
    '<div class="card">' +
      '<h2 class="card-t">מחוברים <span class="pill" dir="ltr">' + v.players.length + ' / 10</span></h2>' +
      playersBox(v) +
      '<p class="hint" style="margin-top:12px">' +
        (enough
          ? 'אפשר להתחיל. מי שיצטרף אחרי ההתחלה לא ייכנס למשחק.'
          : 'צריך לפחות 5 שחקנים כדי להתחיל — חסרים עוד ' + (5 - v.players.length) + '.') +
      '</p>' +
    '</div>' +
    (v.isHost
      ? '<button class="btn btn-primary" data-act="start"' + (enough ? '' : ' disabled') + '>התחל משחק</button>'
      : waitBox([v.hostName], 'ממתינים שהמארח יתחיל את המשחק')) +
    '<p class="hint" style="text-align:center">אל תסגרו את הדף — החיבור נשמר כל עוד הוא פתוח.</p>' +
  '</div>';
}

function renderMenu() {
  const st = APP.status;
  return '<div class="screen fade">' +
    '<div class="logo"><div class="logo-mark">SH</div><h1>סיקרט היטלר</h1>' +
      '<p class="sub">אונליין — כל שחקן מהטלפון שלו<br><bdi>5–10</bdi> שחקנים • בלי הרשמה</p></div>' +
    (st ? '<div class="banner neutral" style="font-size:.9rem">' + esc(st) + '</div>' : '') +
    '<div class="card">' +
      '<h2 class="card-t">איך קוראים לך?</h2>' +
      '<input class="name-inp" id="myname" value="' + esc(APP.name) + '" placeholder="השם שלך" maxlength="14" autocomplete="off">' +
    '</div>' +
    '<button class="btn btn-primary" data-act="createRoom">פתיחת חדר חדש</button>' +
    '<div class="card">' +
      '<h2 class="card-t">הצטרפות לחדר קיים</h2>' +
      '<input class="code-inp" id="joincode" value="' + esc(APP.code) + '" placeholder="0000" inputmode="numeric" maxlength="4">' +
      '<button class="btn btn-sm" style="margin-top:12px" data-act="joinRoom">הצטרפות</button>' +
    '</div>' +
    '<button class="btn btn-ghost btn-sm" data-act="sheet" data-v="rules">📖 חוקי המשחק</button>' +
    '<p class="hint" style="text-align:center">רוצים לשחק על מכשיר אחד שעובר בין כולם? יש גם <a href="secret-hitler.html" style="color:var(--gold)">גרסה כזו</a>.</p>' +
  '</div>';
}

function renderConnecting(msg, retry) {
  return '<div class="screen center fade"><div class="handoff">' +
    '<div class="spinner" style="margin:0 auto"></div>' +
    '<div class="who" style="font-size:1.3rem">' + esc(msg) + '</div>' +
    (retry ? '<button class="btn btn-ghost" data-act="backToMenu">חזרה למסך הפתיחה</button>' : '') +
  '</div></div>';
}

/* ── גיליונות ── */
function sheetLog(v) {
  const items = (v && v.log || []).map(l => '<div class="log-item"><span class="rnd">סבב ' + l.r + '</span>' + esc(l.text) + '</div>').join('');
  return '<div class="overlay" data-act="closeSheet"><div class="sheet" data-stop="1">' +
    '<h3>🗒️ יומן המשחק</h3><div class="log-list">' + (items || '<div class="log-item">עוד לא קרה כלום.</div>') + '</div>' +
    '<button class="btn btn-ghost" data-act="closeSheet">סגור</button></div></div>';
}

function sheetRules(v) {
  const n = (v && v.boardSize) || 7;
  const pw = POWERS[n] || POWERS[7];
  const rows = pw.map((k, i) => '<li>מדיניות פשיסטית ' + (i + 1) + ': ' + (k ? POWER_INFO[k].name : 'ללא כוח') + '</li>').join('');
  return '<div class="overlay" data-act="closeSheet"><div class="sheet" data-stop="1">' +
    '<h3>📖 חוקי המשחק</h3>' +
    '<div class="rules-h">המטרה</div>' +
    '<p class="rules-p"><b>ליברלים:</b> להעביר 5 מדיניות ליברליות, או להוציא את היטלר להורג.<br>' +
      '<b>פשיסטים:</b> להעביר 6 מדיניות פשיסטיות, או להכניס את היטלר לתפקיד קנצלר אחרי 3 מדיניות פשיסטיות.</p>' +
    '<div class="rules-h">מהלך סבב</div>' +
    '<ul class="rules-ul">' +
      '<li>הנשיאות עוברת לפי סדר ההצטרפות לחדר. הנשיא מציע קנצלר.</li>' +
      '<li>כולם מצביעים כן/לא מהטלפון שלהם. רוב מאשר; תיקו נחשב כישלון.</li>' +
      '<li>ממשלה שאושרה: הנשיא מושך 3 קלפים ומשליך אחד, הקנצלר מקבל 2 ומעביר אחד.</li>' +
      '<li>אסור להראות את המסך — מותר לשקר.</li>' +
      '<li>שלוש הצבעות כושלות ברצף = כאוס: הקלף העליון מועבר אוטומטית.</li>' +
    '</ul>' +
    '<div class="rules-h">הגבלות מועמדות</div>' +
    '<p class="rules-p">מי שכיהן כנשיא או כקנצלר בממשלה האחרונה שאושרה אינו יכול להיות מועמד לקנצלרות. אם נותרו 5 שחקנים או פחות — רק הקנצלר האחרון חסום.</p>' +
    '<div class="rules-h">כוחות הנשיא בלוח של ' + n + ' שחקנים</div>' +
    '<ul class="rules-ul">' + rows + '<li>אחרי 5 מדיניות פשיסטיות נפתח גם הווטו.</li></ul>' +
    '<div class="rules-h">החפיסה</div>' +
    '<p class="rules-p">בחפיסה <bdi>17</bdi> קלפים: <bdi>6</bdi> ליברליים ו-<bdi>11</bdi> פשיסטיים. כשנשארים פחות מ-3, ההשלכות מעורבבות בחזרה.</p>' +
    '<button class="btn btn-ghost" data-act="closeSheet" style="margin-top:16px">סגור</button></div></div>';
}

/* ── הראוטר ── */
function renderView(v) {
  if (!v) return renderMenu();
  if (v.phase === 'lobby') return renderLobby(v);
  if (v.phase === 'roles') return renderRoles(v);
  if (v.phase === 'gameover') return renderGameOver(v);
  return renderGame(v);
}

/* ══════════════ מצב האפליקציה ══════════════ */

const APP = {
  mode: 'menu',        /* menu | connecting | play */
  name: LS.get('sh.name') || '',
  code: '',
  myPid: LS.get('sh.pid') || uid(),
  isHost: false,
  view: null,
  status: '',
  lastPhase: null,
};
LS.set('sh.pid', APP.myPid);

const ROOM_PREFIX = 'golazo-sh-';
const HOST = { peer: null, code: null, conns: new Map(), lobby: [], G: null };
const CLIENT = { peer: null, conn: null };

function paint() {
  let html;
  if (APP.mode === 'menu') html = renderMenu();
  else if (APP.mode === 'connecting') html = renderConnecting(APP.status || 'מתחבר…', true);
  else html = renderView(APP.view);
  if (UI.sheet === 'log') html += sheetLog(APP.view);
  if (UI.sheet === 'rules') html += sheetRules(APP.view);
  app.innerHTML = html;
}

function setView(v) {
  if (v && v.phase !== APP.lastPhase) { UI.pending = null; APP.lastPhase = v.phase; }
  if (v && APP.view && v.phase !== APP.view.phase) buzz(20);
  APP.view = v;
  APP.mode = 'play';
  paint();
}

/* ══════════════ צד המארח ══════════════ */

function lobbyViewFor(pid) {
  const meIdx = HOST.lobby.findIndex(p => p.id === pid);
  return {
    phase: 'lobby',
    code: HOST.code,
    boardSize: Math.min(10, Math.max(5, HOST.lobby.length)),
    lib: 0, fas: 0, tracker: 0,
    isHost: pid === APP.myPid,
    hostName: HOST.lobby.length ? HOST.lobby[0].name : '',
    players: HOST.lobby.map((p, k) => ({
      name: p.name, alive: true, connected: p.connected,
      pres: false, chan: false, me: k === meIdx,
    })),
    me: { name: meIdx >= 0 ? HOST.lobby[meIdx].name : '', alive: true, role: 'liberal', team: null },
    waiting: [], log: [],
  };
}

function hostBroadcast() {
  const build = pid => (HOST.G ? viewFor(HOST.G, pid) : lobbyViewFor(pid));
  HOST.conns.forEach((conn, pid) => {
    if (!conn || !conn.open) return;
    const v = build(pid);
    if (v) { try { conn.send({ t: 'view', v }); } catch (e) {} }
  });
  setView(build(APP.myPid));
}

function hostSetConnected(pid, on) {
  if (HOST.G) { const p = HOST.G.players.find(x => x.id === pid); if (p) p.connected = on; }
  const l = HOST.lobby.find(x => x.id === pid);
  if (l) l.connected = on;
}

function uniqueName(raw) {
  let name = (raw || '').trim().slice(0, 14) || 'שחקן';
  const taken = HOST.lobby.map(p => p.name);
  if (!taken.includes(name)) return name;
  for (let n = 2; n < 40; n++) if (!taken.includes(name + ' ' + n)) return name + ' ' + n;
  return name + ' ' + Date.now().toString().slice(-3);
}

function hostHandle(conn, msg) {
  if (!msg || typeof msg !== 'object') return;

  if (msg.t === 'join') {
    const pid = typeof msg.pid === 'string' ? msg.pid.slice(0, 40) : '';
    if (!pid) return;
    const known = HOST.lobby.some(p => p.id === pid);

    if (HOST.G && !known) { try { conn.send({ t: 'deny', reason: 'המשחק כבר התחיל — אי אפשר להצטרף באמצע.' }); } catch (e) {} return; }
    if (!HOST.G && !known && HOST.lobby.length >= 10) { try { conn.send({ t: 'deny', reason: 'החדר מלא (10 שחקנים).' }); } catch (e) {} return; }

    HOST.conns.set(pid, conn);
    conn._pid = pid;
    if (!known) HOST.lobby.push({ id: pid, name: uniqueName(msg.name), connected: true });
    else hostSetConnected(pid, true);
    try { conn.send({ t: 'welcome', pid }); } catch (e) {}
    hostBroadcast();
    return;
  }

  if (msg.t === 'act' && conn._pid) {
    if (!HOST.G) {
      if (msg.act && msg.act.a === 'leave') {
        HOST.lobby = HOST.lobby.filter(p => p.id !== conn._pid);
        HOST.conns.delete(conn._pid);
        hostBroadcast();
      }
      return;
    }
    if (applyAction(HOST.G, conn._pid, msg.act)) hostBroadcast();
  }
}

function hostStartGame() {
  if (HOST.G || HOST.lobby.length < 5 || HOST.lobby.length > 10) return;
  HOST.G = createGame(HOST.lobby.map(p => ({ id: p.id, name: p.name })), APP.myPid);
  HOST.lobby.forEach(p => { const g = HOST.G.players.find(x => x.id === p.id); if (g) g.connected = p.connected; });
  hostBroadcast();
}

function hostRestart() {
  if (!HOST.G) return;
  const players = HOST.G.players.map(p => ({ id: p.id, name: p.name }));
  const conn = HOST.G.players.reduce((m, p) => (m[p.id] = p.connected, m), {});
  HOST.G = createGame(players, APP.myPid);
  HOST.G.players.forEach(p => { p.connected = conn[p.id] !== false; });
  hostBroadcast();
}

function makeCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

async function createRoom(name) {
  APP.mode = 'connecting'; APP.status = 'פותח חדר…'; paint();
  let Peer;
  try { Peer = await loadPeer(); } catch (e) { return netFail('לא הצלחתי לטעון את רכיב החיבור. בדקו את החיבור לאינטרנט ורעננו.'); }

  let attempts = 0;
  const tryOpen = () => {
    const code = makeCode();
    const peer = new Peer(ROOM_PREFIX + code, { debug: 0 });
    let settled = false;

    peer.on('open', () => {
      settled = true;
      HOST.peer = peer; HOST.code = code;
      APP.isHost = true; APP.code = code;
      HOST.lobby = [{ id: APP.myPid, name: uniqueName(name), connected: true }];
      HOST.conns = new Map();
      hostBroadcast();
    });

    peer.on('connection', conn => {
      conn.on('data', msg => hostHandle(conn, msg));
      conn.on('close', () => { if (conn._pid) { hostSetConnected(conn._pid, false); hostBroadcast(); } });
      conn.on('error', () => {});
    });

    peer.on('error', err => {
      const type = err && err.type;
      if (!settled && type === 'unavailable-id' && ++attempts < 6) { try { peer.destroy(); } catch (e) {} return tryOpen(); }
      if (!settled) return netFail('לא הצלחתי לפתוח חדר. ייתכן שהרשת חוסמת את החיבור — נסו רשת אחרת.');
      if (type === 'network' || type === 'server-error' || type === 'socket-error') {
        APP.status = 'החיבור לשרת התיווך נותק — השחקנים המחוברים ממשיכים לעבוד.';
        paint();
      }
    });
  };
  tryOpen();
}

/* ══════════════ צד השחקן המצטרף ══════════════ */

async function joinRoom(code, name) {
  APP.mode = 'connecting'; APP.status = 'מתחבר לחדר ' + code + '…'; paint();
  let Peer;
  try { Peer = await loadPeer(); } catch (e) { return netFail('לא הצלחתי לטעון את רכיב החיבור. בדקו את החיבור לאינטרנט ורעננו.'); }

  const peer = new Peer({ debug: 0 });
  CLIENT.peer = peer;
  let opened = false;

  peer.on('open', () => {
    const conn = peer.connect(ROOM_PREFIX + code, { reliable: true });
    CLIENT.conn = conn;
    const giveUp = setTimeout(() => { if (!opened) netFail('לא נמצא חדר עם הקוד ' + code + '. בדקו את הקוד ושהמארח לא סגר את הדף.'); }, 12000);

    conn.on('open', () => {
      opened = true;
      clearTimeout(giveUp);
      APP.isHost = false; APP.code = code;
      conn.send({ t: 'join', pid: APP.myPid, name });
    });
    conn.on('data', msg => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'view') setView(msg.v);
      else if (msg.t === 'deny') netFail(msg.reason || 'ההצטרפות נדחתה.');
    });
    conn.on('close', () => {
      if (APP.mode === 'play') { APP.mode = 'connecting'; APP.status = 'החיבור למארח נותק. בקשו ממנו לוודא שהדף פתוח, ונסו להצטרף שוב.'; paint(); }
    });
    conn.on('error', () => {});
  });

  peer.on('error', err => {
    const type = err && err.type;
    if (type === 'peer-unavailable') return netFail('לא נמצא חדר עם הקוד ' + code + '. בדקו את הקוד ושהמארח לא סגר את הדף.');
    if (!opened) netFail('החיבור נכשל. אם אתם ברשת סלולרית, נסו להתחבר לאותו WiFi של שאר השחקנים.');
  });
}

function netFail(msg) {
  APP.mode = 'menu';
  APP.status = msg;
  APP.view = null;
  paint();
}

/* ── שליחת פעולה ── */
function doAction(act) {
  if (APP.isHost) {
    if (!HOST.G) return;
    if (applyAction(HOST.G, APP.myPid, act)) hostBroadcast();
  } else if (CLIENT.conn && CLIENT.conn.open) {
    try { CLIENT.conn.send({ t: 'act', act }); } catch (e) {}
  }
}

/* ══════════════ אירועים ══════════════ */

app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'myname') { APP.name = el.value; LS.set('sh.name', el.value); }
  if (el.id === 'joincode') { APP.code = el.value.replace(/\D/g, '').slice(0, 4); if (el.value !== APP.code) el.value = APP.code; }
});

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const i = el.dataset.i != null ? +el.dataset.i : null;
  if (act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;

  switch (act) {
    /* — תפריט — */
    case 'createRoom': {
      const nameEl = document.getElementById('myname');
      const name = ((nameEl && nameEl.value) || APP.name || '').trim();
      if (!name) { APP.status = 'צריך להזין שם לפני שפותחים חדר.'; return paint(); }
      APP.name = name; LS.set('sh.name', name);
      APP.status = '';
      createRoom(name);
      break;
    }
    case 'joinRoom': {
      const nameEl = document.getElementById('myname');
      const codeEl = document.getElementById('joincode');
      const name = ((nameEl && nameEl.value) || APP.name || '').trim();
      const code = ((codeEl && codeEl.value) || APP.code || '').replace(/\D/g, '');
      if (!name) { APP.status = 'צריך להזין שם.'; return paint(); }
      if (code.length !== 4) { APP.status = 'קוד החדר הוא ארבע ספרות.'; return paint(); }
      APP.name = name; LS.set('sh.name', name);
      APP.code = code; APP.status = '';
      joinRoom(code, name);
      break;
    }
    case 'backToMenu':
      APP.mode = 'menu'; APP.status = ''; paint(); break;

    case 'share': {
      const url = location.href.split('#')[0] + '#' + HOST.code;
      const done = () => { APP.status = ''; el.textContent = '✓ הקישור הועתק'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText('בואו לשחק סיקרט היטלר! קוד החדר: ' + HOST.code + '\n' + url).then(done, () => { el.textContent = url; });
      } else { el.textContent = url; }
      break;
    }

    /* — לובי — */
    case 'start': hostStartGame(); break;
    case 'restart': if (APP.isHost) hostRestart(); break;

    /* — בחירה מקומית לפני אישור — */
    case 'pick':
    case 'pickTarget':
      UI.pending = (UI.pending === i ? null : i); paint(); break;
    case 'cancel':
      UI.pending = null; paint(); break;
    case 'toggleRole':
      UI.showRole = !UI.showRole; paint(); break;

    /* — פעולות משחק — */
    case 'ready':      doAction({ a: 'ready' }); break;
    case 'nominate':   doAction({ a: 'nominate', i }); break;
    case 'vote':       doAction({ a: 'vote', v: el.dataset.v === '1' }); break;
    case 'skipDisconnected': doAction({ a: 'skipDisconnected' }); break;
    case 'continue':   doAction({ a: 'continue' }); break;
    case 'discard':    UI.pending = null; doAction({ a: 'discard', i }); break;
    case 'enact':      UI.pending = null; doAction({ a: 'enact', i }); break;
    case 'veto':       doAction({ a: 'veto' }); break;
    case 'vetoYes':    doAction({ a: 'vetoYes' }); break;
    case 'vetoNo':     doAction({ a: 'vetoNo' }); break;
    case 'power':      UI.pending = null; doAction({ a: 'power', i }); break;

    /* — גיליונות — */
    case 'sheet': UI.sheet = el.dataset.v; paint(); break;
    case 'closeSheet': UI.sheet = null; paint(); break;
  }
});

window.addEventListener('beforeunload', e => {
  if (APP.mode === 'play' && APP.isHost && HOST.G && HOST.G.phase !== 'gameover') { e.preventDefault(); e.returnValue = ''; }
});

/* ══════════════ אתחול ══════════════ */

function fatal(msg) {
  app.innerHTML = '<div class="screen center"><div class="card"><h2 class="card-t">משהו השתבש</h2>' +
    '<p class="hint">' + esc(msg) + '</p><p class="hint" style="margin-top:10px">נסו לרענן את הדף.</p></div></div>';
}
window.addEventListener('error', e => { if (!app.innerHTML.trim()) fatal(e.message || 'שגיאה לא ידועה'); });

(function boot() {
  const h = (location.hash || '').replace(/\D/g, '');
  if (h.length === 4) APP.code = h;
  try { paint(); } catch (e) { fatal(e.message); }
})();
</script>
