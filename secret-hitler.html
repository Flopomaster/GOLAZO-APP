<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="סיקרט היטלר – משחק חברתי לנייד, מכשיר אחד שעובר בין השחקנים">
<title>סיקרט היטלר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' fill='%23f0b429' text-anchor='middle'%3ESH%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d12; --surface:#161a23; --surface2:#1e2430; --line:#2a3345;
  --text:#e6e9f0; --muted:#8b96ab;
  --lib:#3b82f6; --lib-dim:#1d3a6b;
  --fas:#dc2626; --fas-dim:#5c1b1b;
  --gold:#f0b429; --ok:#22c55e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Heebo','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
input,button,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}

/* ── LAYOUT ── */
.screen{
  max-width:540px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;min-height:100dvh;
}
.grow{flex:1}
.center{justify-content:center;text-align:center}

/* ── TITLE ── */
.logo{text-align:center;padding:10px 0 4px}
.logo-mark{
  width:64px;height:64px;margin:0 auto 12px;border-radius:16px;
  background:linear-gradient(145deg,var(--fas),#7f1d1d);
  display:grid;place-items:center;font-weight:900;font-size:1.5rem;color:#fff;
  box-shadow:0 10px 30px #dc262640;letter-spacing:1px;
}
.logo h1{font-size:2rem;font-weight:900;letter-spacing:-.5px}
.logo .sub{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.6}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card-t{font-size:.95rem;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pill{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px}
.hint{font-size:.78rem;color:var(--muted);line-height:1.65}

/* ── BUTTONS ── */
.btn{
  display:block;width:100%;padding:15px 16px;border-radius:14px;
  font-size:1rem;font-weight:800;text-align:center;
  background:var(--surface2);color:var(--text);border:1px solid var(--line);
  transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-primary{background:linear-gradient(160deg,var(--gold),#d99a12);color:#1a1204;border-color:transparent}
.btn-lib{background:var(--lib);color:#fff;border-color:transparent}
.btn-fas{background:var(--fas);color:#fff;border-color:transparent}
.btn-ok{background:var(--ok);color:#05230f;border-color:transparent}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);font-weight:700}
.btn-sm{padding:11px 14px;font-size:.88rem}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}

/* ── SETUP NAMES ── */
.names{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.name-row{display:flex;align-items:center;gap:9px}
.seat{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface2);
  color:var(--muted);font-size:.72rem;font-weight:800;display:grid;place-items:center;
}
.name-inp{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  color:var(--text);font-size:1rem;font-weight:700;padding:12px 13px;outline:none;
}
.name-inp:focus{border-color:var(--gold)}
.x{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:.9rem}

/* ── BOARD ── */
.board{display:flex;flex-direction:column;gap:10px}
.track{border-radius:14px;padding:10px 11px;border:1px solid var(--line)}
.track.lib{background:linear-gradient(180deg,#0f1d33,#0d1626)}
.track.fas{background:linear-gradient(180deg,#2a1010,#1c0c0c)}
.track-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.track-name{font-size:.72rem;font-weight:900;letter-spacing:1px}
.track.lib .track-name{color:#93c5fd}
.track.fas .track-name{color:#fca5a5}
.track-count{font-size:.7rem;font-weight:800;color:var(--muted)}
.slots{display:flex;gap:5px}
.slot{
  flex:1;aspect-ratio:.72;border-radius:7px;border:1px dashed #ffffff26;
  display:grid;place-items:center;font-size:.58rem;font-weight:800;color:#ffffff4d;
  text-align:center;line-height:1.15;padding:2px;
}
.slot.on{border-style:solid;border-color:transparent;color:#fff}
.track.lib .slot.on{background:linear-gradient(160deg,#3b82f6,#1d4ed8);box-shadow:0 3px 10px #3b82f650}
.track.fas .slot.on{background:linear-gradient(160deg,#dc2626,#7f1d1d);box-shadow:0 3px 10px #dc262650}

.tracker{display:flex;align-items:center;gap:9px;justify-content:center;padding:2px 0}
.tracker-lbl{font-size:.7rem;font-weight:800;color:var(--muted)}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.on{background:var(--gold);border-color:var(--gold)}

/* ── PLAYERS ── */
.plist{display:flex;flex-wrap:wrap;gap:7px}
.ptag{
  background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:7px 11px;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:6px;
}
.ptag.dead{opacity:.4;text-decoration:line-through}
.ptag .role-badge{font-size:.62rem;font-weight:900;padding:1px 6px;border-radius:6px;background:var(--gold);color:#1a1204}
.ptag.pres{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ptag.chan{border-color:#93c5fd;box-shadow:0 0 0 1px #93c5fd inset}

/* ── HANDOFF ── */
.handoff{text-align:center;display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.handoff .who{font-size:2rem;font-weight:900;line-height:1.2}
.handoff .lead{font-size:.95rem;color:var(--muted)}
.handoff .icon{font-size:3rem}

/* ── ROLE CARD ── */
.role-card{border-radius:20px;padding:26px 20px;text-align:center;border:2px solid}
.role-card.lib{background:linear-gradient(170deg,#12294d,#0c1a2e);border-color:var(--lib)}
.role-card.fas{background:linear-gradient(170deg,#3d1111,#220a0a);border-color:var(--fas)}
.role-card .r-lbl{font-size:.72rem;font-weight:800;letter-spacing:2px;color:var(--muted)}
.role-card .r-name{font-size:2.2rem;font-weight:900;margin:6px 0 4px}
.role-card.lib .r-name{color:#93c5fd}
.role-card.fas .r-name{color:#fca5a5}
.role-card .r-desc{font-size:.86rem;color:#cbd5e1;line-height:1.7;margin-top:10px}
.team-box{margin-top:14px;background:#00000040;border-radius:12px;padding:12px}
.team-box .t-lbl{font-size:.7rem;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
.team-box .t-names{font-size:.95rem;font-weight:800;line-height:1.7}

/* ── POLICY CARDS ── */
.pol-row{display:flex;gap:10px;justify-content:center}
.pol{
  flex:1;max-width:150px;aspect-ratio:.7;border-radius:14px;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-weight:900;text-align:center;padding:8px;transition:transform .1s;
}
.pol:active{transform:scale(.96)}
.pol.sel{outline:3px solid var(--gold);outline-offset:3px}
.pol.dim{opacity:.4}
.pol.L{background:linear-gradient(165deg,#3b82f6,#1e40af);color:#fff}
.pol.F{background:linear-gradient(165deg,#dc2626,#7f1d1d);color:#fff}
.pol .p-name{font-size:1rem}
.pol .p-act{font-size:.7rem;font-weight:800;opacity:.85;background:#00000040;padding:3px 8px;border-radius:7px}
.pol .p-ico{font-size:1.7rem}

/* ── VOTE ── */
.vote-row{display:flex;gap:12px}
.vote-btn{flex:1;padding:26px 10px;border-radius:18px;font-size:1.5rem;font-weight:900;color:#fff}
.vote-btn.ja{background:linear-gradient(160deg,#22c55e,#15803d)}
.vote-btn.nein{background:linear-gradient(160deg,#ef4444,#991b1b)}
.vote-list{display:flex;flex-direction:column;gap:7px}
.vote-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:11px;padding:10px 13px;font-weight:700;font-size:.9rem}
.v-ja{color:#4ade80;font-weight:900}
.v-nein{color:#f87171;font-weight:900}

/* ── BANNERS ── */
.banner{border-radius:16px;padding:18px;text-align:center;font-weight:900;font-size:1.15rem;line-height:1.5}
.banner.lib{background:linear-gradient(160deg,#1d4ed8,#0f2f6b);color:#fff}
.banner.fas{background:linear-gradient(160deg,#b91c1c,#5c1010);color:#fff}
.banner.neutral{background:var(--surface2);color:var(--text)}
.banner .b-sub{font-size:.82rem;font-weight:700;opacity:.85;margin-top:7px}

.chip-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:700;color:var(--muted)}
.chip b{color:var(--text)}

/* ── SELECT LIST ── */
.sel-list{display:flex;flex-direction:column;gap:9px}
.sel{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface2);border:1px solid var(--line);border-radius:13px;
  padding:15px 15px;font-size:1rem;font-weight:800;width:100%;text-align:right;
}
.sel:active{transform:scale(.99)}
.sel .why{font-size:.72rem;font-weight:700;color:var(--muted)}
.sel[disabled]{opacity:.38;pointer-events:none}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h2{font-size:1.05rem;font-weight:900}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1rem}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:#000000cc;backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:540px;max-height:82dvh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}
.sheet h3{font-size:1.05rem;font-weight:900;margin-bottom:12px}
.log-list{display:flex;flex-direction:column-reverse;gap:7px;margin-bottom:14px}
.log-item{background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:.83rem;line-height:1.5}
.log-item .rnd{font-size:.68rem;font-weight:900;color:var(--muted);margin-left:6px}
.rules-h{font-size:.86rem;font-weight:900;color:var(--gold);margin:14px 0 5px}
.rules-p{font-size:.82rem;color:#cbd5e1;line-height:1.75}
.rules-p b{color:#fff}
ul.rules-ul{padding-inline-start:18px;font-size:.82rem;color:#cbd5e1;line-height:1.8}

.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ══════════════════════════════════════════════════════════
   סיקרט היטלר — משחק "מכשיר אחד" (pass & play) ל-5–10 שחקנים
   ══════════════════════════════════════════════════════════ */

const app = document.getElementById('app');
const SAVE_KEY = 'golazo.secrethitler.v1';
const NAMES_KEY = 'golazo.secrethitler.names';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ── טבלת הרכב תפקידים ── */
const SETUP = {
  5:  { fascists: 1, hitlerKnows: true  },
  6:  { fascists: 1, hitlerKnows: true  },
  7:  { fascists: 2, hitlerKnows: false },
  8:  { fascists: 2, hitlerKnows: false },
  9:  { fascists: 3, hitlerKnows: false },
  10: { fascists: 3, hitlerKnows: false },
};

/* ── כוחות הנשיא לפי לוח (אינדקס = מספר המדיניות הפשיסטית שהועברה) ── */
const POWERS = {
  5:  [null, null, 'peek', 'kill', 'kill'],
  6:  [null, null, 'peek', 'kill', 'kill'],
  7:  [null, 'investigate', 'special', 'kill', 'kill'],
  8:  [null, 'investigate', 'special', 'kill', 'kill'],
  9:  ['investigate', 'investigate', 'special', 'kill', 'kill'],
  10: ['investigate', 'investigate', 'special', 'kill', 'kill'],
};
const POWER_INFO = {
  peek:        { name: 'הצצה במדיניות', short: 'הצצה',        icon: '🔮', desc: 'הנשיא מציץ בשלושת הקלפים העליונים בחפיסה.' },
  investigate: { name: 'חקירת נאמנות',  short: 'חקירה',       icon: '🔍', desc: 'הנשיא בוחר שחקן ורואה את השתייכות המפלגתית שלו.' },
  special:     { name: 'בחירות מיוחדות', short: 'בחירות',      icon: '🗳️', desc: 'הנשיא בוחר מי יהיה הנשיא בסבב הבא (חד־פעמי).' },
  kill:        { name: 'הוצאה להורג',   short: 'הוצאה להורג', icon: '💀', desc: 'הנשיא בוחר שחקן שיוצא מהמשחק.' },
};

let S = null;   /* מצב המשחק */
let UI = { showSheet: null, names: [] };

/* ── יצירת מצב חדש ── */
function newGame(names) {
  const n = names.length;
  const conf = SETUP[n];
  const roles = [];
  for (let i = 0; i < conf.fascists; i++) roles.push('fascist');
  roles.push('hitler');
  while (roles.length < n) roles.push('liberal');
  shuffle(roles);

  S = {
    boardSize: n,
    hitlerKnows: conf.hitlerKnows,
    players: names.map((name, i) => ({ name, role: roles[i], alive: true })),
    deck: shuffle(Array(6).fill('L').concat(Array(11).fill('F'))),
    discard: [],
    lib: 0, fas: 0,
    tracker: 0,
    round: 1,
    presIdx: 0,        /* הנשיא הנוכחי */
    regularIdx: 0,     /* מיקום התור ה"רגיל" סביב השולחן */
    inSpecial: false,  /* הנשיא הנוכחי נבחר בבחירות מיוחדות */
    pendingSpecial: null,
    chanIdx: null,
    lastPres: null, lastChan: null,
    votes: [], voteIdx: 0,
    drawn: [], chanCards: [],
    veto: false, vetoAsked: false,
    investigated: [],
    powerKind: null, powerStage: null, powerTarget: null,
    revealed: false, roleIdx: 0, pending: null,
    lastEnacted: null, lastByChaos: false,
    winner: null, winReason: '',
    log: [],
    phase: 'roles',
  };
  log('המשחק התחיל — ' + n + ' שחקנים: ' + conf.fascists + ' פשיסטים + היטלר מול ' + (n - conf.fascists - 1) + ' ליברלים');
  save();
}

function log(text) { S.log.push({ r: S.round, text }); }

/* אחסון מקומי — בחלק מהדפדפנים (file://, גלישה פרטית, חסימת עוגיות)
   עצם הגישה ל-localStorage זורקת שגיאה, ולכן הכול עטוף */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function save() { LS.set(SAVE_KEY, JSON.stringify(S)); }
function clearSave() { LS.del(SAVE_KEY); }

/* ── עזרי שחקנים ── */
const P = i => S.players[i];
const alive = () => S.players.filter(p => p.alive);
const aliveCount = () => alive().length;
const nm = i => (i == null ? '—' : S.players[i].name);

function nextAliveAfter(i) {
  let j = i;
  for (let k = 0; k < S.players.length; k++) {
    j = (j + 1) % S.players.length;
    if (S.players[j].alive) return j;
  }
  return i;
}

function eligibleChancellor(i) {
  if (i === S.presIdx || !P(i).alive) return false;
  if (i === S.lastChan) return false;
  if (i === S.lastPres && aliveCount() > 5) return false;
  return true;
}

function fascistTeam(i) {
  return S.players
    .map((p, idx) => ({ p, idx }))
    .filter(o => o.idx !== i && (o.p.role === 'fascist' || o.p.role === 'hitler'));
}

/* ── חפיסה ── */
function ensureDeck(n) {
  if (S.deck.length < n) {
    S.deck = shuffle(S.deck.concat(S.discard));
    S.discard = [];
    log('החפיסה נגמרה — הקלפים שהושלכו עורבבו מחדש');
  }
}

/* ══════════════ זרימת המשחק ══════════════ */

function startRound() {
  if (S.pendingSpecial !== null) {
    S.presIdx = S.pendingSpecial;
    S.pendingSpecial = null;
    S.inSpecial = true;
    log('בחירות מיוחדות: ' + nm(S.presIdx) + ' מונה לנשיא');
  } else {
    if (S.inSpecial) S.inSpecial = false;
    S.regularIdx = nextAliveAfter(S.regularIdx);
    S.presIdx = S.regularIdx;
  }
  S.chanIdx = null;
  S.pending = null;
  S.votes = []; S.voteIdx = 0;
  S.drawn = []; S.chanCards = [];
  S.vetoAsked = false;
  S.revealed = false;
  S.powerKind = null; S.powerStage = null; S.powerTarget = null;
  S.phase = 'nominate';
  render();
}

function nominate(i) {
  S.chanIdx = i;
  S.voteIdx = 0;
  S.votes = [];
  S.revealed = false;
  S.phase = 'vote';
  log('סבב ' + S.round + ': ' + nm(S.presIdx) + ' מציע את ' + nm(i) + ' לקנצלר');
  render();
}

function castVote(v) {
  const order = alive();
  S.votes.push({ name: order[S.voteIdx].name, v });
  S.voteIdx++;
  S.revealed = false;
  if (S.voteIdx >= order.length) S.phase = 'voteResult';
  render();
}

function votePassed() {
  const ja = S.votes.filter(x => x.v).length;
  return ja * 2 > S.votes.length;
}

function afterVote() {
  if (votePassed()) {
    log('ההצבעה עברה — ' + nm(S.presIdx) + ' (נשיא) ו-' + nm(S.chanIdx) + ' (קנצלר)');
    S.lastPres = S.presIdx;
    S.lastChan = S.chanIdx;
    if (S.fas >= 3 && P(S.chanIdx).role === 'hitler') {
      return endGame('fascist', 'היטלר נבחר לקנצלר אחרי שלוש מדיניות פשיסטיות');
    }
    ensureDeck(3);
    S.drawn = [S.deck.shift(), S.deck.shift(), S.deck.shift()];
    S.revealed = false;
    S.phase = 'presDraw';
    render();
  } else {
    log('ההצבעה נכשלה');
    S.tracker++;
    if (S.tracker >= 3) return chaos();
    S.round++;
    startRound();
  }
}

function chaos() {
  ensureDeck(1);
  const card = S.deck.shift();
  S.tracker = 0;
  S.lastPres = null;
  S.lastChan = null;
  log('שלוש הצבעות נכשלו ברצף — כאוס! המדיניות העליונה מועברת אוטומטית');
  enact(card, true);
}

function enact(card, byChaos) {
  if (card === 'L') S.lib++; else S.fas++;
  S.tracker = 0;   /* מד הבחירות מתאפס בכל פעם שמדיניות מועברת */
  S.lastEnacted = card;
  S.lastByChaos = !!byChaos;
  log('הועברה מדיניות ' + (card === 'L' ? 'ליברלית' : 'פשיסטית') + ' (ליברלים ' + S.lib + ', פשיסטים ' + S.fas + ')');
  if (!S.veto && S.fas >= 5) { S.veto = true; log('כוח הווטו נפתח'); }

  if (S.lib >= 5) return endGame('liberal', 'חמש מדיניות ליברליות הועברו');
  if (S.fas >= 6) return endGame('fascist', 'שש מדיניות פשיסטיות הועברו');

  S.powerKind = (!byChaos && card === 'F') ? (POWERS[S.boardSize][S.fas - 1] || null) : null;
  S.powerStage = S.powerKind ? 'select' : null;
  S.powerTarget = null;
  S.revealed = false;
  S.phase = 'enacted';
  render();
}

function afterEnacted() {
  if (S.powerKind) {
    S.phase = 'power';
    S.revealed = false;
    if (S.powerKind === 'peek') { ensureDeck(3); S.powerStage = 'result'; }
    render();
  } else {
    S.round++;
    startRound();
  }
}

function usePower(targetIdx) {
  const k = S.powerKind;
  S.powerTarget = targetIdx;
  S.pending = null;
  if (k === 'investigate') {
    S.investigated.push(targetIdx);
    log(nm(S.presIdx) + ' חוקר את נאמנותו של ' + nm(targetIdx));
    S.powerStage = 'result';
    S.revealed = false;
  } else if (k === 'special') {
    S.pendingSpecial = targetIdx;
    log(nm(S.presIdx) + ' מכריז על בחירות מיוחדות: ' + nm(targetIdx));
    S.powerStage = 'result';
  } else if (k === 'kill') {
    P(targetIdx).alive = false;
    log(nm(S.presIdx) + ' הוציא להורג את ' + nm(targetIdx));
    if (P(targetIdx).role === 'hitler') {
      S.powerStage = 'result';
      render();
      return endGame('liberal', 'היטלר הוצא להורג');
    }
    S.powerStage = 'result';
  }
  render();
}

function finishPower() {
  S.round++;
  startRound();
}

function endGame(winner, reason) {
  S.winner = winner;
  S.winReason = reason;
  S.phase = 'gameover';
  log('סוף המשחק — ' + (winner === 'liberal' ? 'הליברלים ניצחו' : 'הפשיסטים ניצחו') + ': ' + reason);
  buzz([60, 40, 120]);
  render();
}

/* ══════════════ רכיבי תצוגה ══════════════ */

function boardView() {
  const powers = POWERS[S.boardSize];
  const libSlots = Array.from({ length: 5 }, (_, i) =>
    '<div class="slot' + (i < S.lib ? ' on' : '') + '">' + (i === 4 ? 'ניצחון' : '') + '</div>').join('');
  const fasSlots = Array.from({ length: 6 }, (_, i) => {
    const pw = powers[i];
    const label = i === 5 ? 'ניצחון' : (pw ? POWER_INFO[pw].icon : '');
    return '<div class="slot' + (i < S.fas ? ' on' : '') + '">' + label + '</div>';
  }).join('');
  const dots = [0, 1, 2].map(i => '<div class="dot' + (i < S.tracker ? ' on' : '') + '"></div>').join('');

  return '' +
  '<div class="board">' +
    '<div class="track lib">' +
      '<div class="track-head"><span class="track-name">ליברלים</span><span class="track-count" dir="ltr">' + S.lib + ' / 5</span></div>' +
      '<div class="slots">' + libSlots + '</div>' +
    '</div>' +
    '<div class="track fas">' +
      '<div class="track-head"><span class="track-name">פשיסטים</span><span class="track-count" dir="ltr">' + S.fas + ' / 6</span></div>' +
      '<div class="slots">' + fasSlots + '</div>' +
    '</div>' +
    '<div class="tracker"><span class="tracker-lbl">מד בחירות כושלות</span>' + dots + '</div>' +
  '</div>';
}

function playersView() {
  return '<div class="plist">' + S.players.map((p, i) => {
    const cls = ['ptag'];
    if (!p.alive) cls.push('dead');
    if (i === S.presIdx && p.alive) cls.push('pres');
    if (i === S.chanIdx && p.alive) cls.push('chan');
    let badge = '';
    if (i === S.presIdx && p.alive) badge = '<span class="role-badge">נשיא</span>';
    else if (i === S.chanIdx && p.alive) badge = '<span class="role-badge" style="background:#93c5fd">קנצלר</span>';
    return '<div class="' + cls.join(' ') + '">' + esc(p.name) + badge + '</div>';
  }).join('') + '</div>';
}

function topbar(title) {
  return '<div class="topbar">' +
    '<h2>' + title + '</h2>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="icon-btn" data-act="sheet" data-v="rules" aria-label="חוקים">📖</button>' +
      '<button class="icon-btn" data-act="sheet" data-v="log" aria-label="יומן">🗒️</button>' +
    '</div></div>';
}

function handoff(name, sub, actLabel) {
  return '<div class="screen center fade">' +
    '<div class="handoff">' +
      '<div class="icon">📲</div>' +
      '<div class="lead">העבירו את המכשיר אל</div>' +
      '<div class="who">' + esc(name) + '</div>' +
      '<div class="lead">' + sub + '</div>' +

function policyCard(card, action, idx, sub, state) {
  const isL = card === 'L';

}

function scrEnacted() {
  const card = S.lastEnacted;
  const pw = S.powerKind ? POWER_INFO[S.powerKind] : null;
  return '<div class="screen fade">' +
    topbar('מדיניות הועברה') +
    '<div class="banner ' + (card === 'L' ? 'lib' : 'fas') + '">' +
      (card === 'L' ? '🕊️ הועברה מדיניות ליברלית' : '🔥 הועברה מדיניות פשיסטית') +
      '<div class="b-sub">' + (S.lastByChaos ? 'כאוס — המדיניות העליונה הועברה אוטומטית' : 'נשיא ' + esc(nm(S.presIdx)) + ' • קנצלר ' + esc(nm(S.chanIdx))) + '</div>' +
    '</div>' +
    boardView() +
    (pw ? '<div class="card"><h2 class="card-t">' + pw.icon + ' כוח נשיאותי: ' + pw.name + '</h2><p class="hint">' + pw.desc + '</p></div>' : '') +
    '<div class="grow"></div>' +
    '<button class="btn btn-primary" data-act="afterEnacted">' + (pw ? 'המשך — הפעלת הכוח' : 'המשך לסבב הבא') + '</button>' +
  '</div>';
}

function scrPower() {
  const k = S.powerKind;
  const info = POWER_INFO[k];

  /* — בחירת יעד (מסך פומבי) — */
  if (S.powerStage === 'select') {
    const rows = S.players.map((p, i) => {
      if (!p.alive) return '';
      let why = '', dis = false;
      if (i === S.presIdx) { why = 'זה אתה'; dis = true; }
      else if (k === 'investigate' && S.investigated.includes(i)) { why = 'כבר נחקר בעבר'; dis = true; }
      const act = (k === 'kill') ? 'pickTarget' : 'power';
      const selMark = (k === 'kill' && S.pending === i) ? ';border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset' : '';
      return '<button class="sel" style="text-align:right' + selMark + '" data-act="' + act + '" data-i="' + i + '"' + (dis ? ' disabled' : '') + '>' +
        '<span>' + esc(p.name) + '</span><span class="why">' + why + '</span></button>';
    }).join('');
    return '<div class="screen fade">' +
      topbar(info.icon + ' ' + info.name) +
      '<div class="card">' +
        '<h2 class="card-t">' + esc(nm(S.presIdx)) + ', בחרו שחקן</h2>' +
        '<p class="hint" style="margin-bottom:12px">' + info.desc + '</p>' +
        '<div class="sel-list">' + rows + '</div>' +
      '</div>' +
      (k === 'kill' && S.pending != null
        ? '<div class="card" style="border-color:var(--gold)">' +
            '<p class="hint" style="margin-bottom:10px;text-align:center">להוציא להורג את <b>' + esc(nm(S.pending)) + '</b>? הפעולה בלתי הפיכה.</p>' +
            '<div class="btn-row"><button class="btn btn-sm btn-fas" data-act="power" data-i="' + S.pending + '">כן, הוצא להורג</button>' +
            '<button class="btn btn-sm btn-ghost" data-act="cancelPick">ביטול</button></div>' +
          '</div>'
        : '') +
    '</div>';
  }

  /* — תוצאה — */
  if (k === 'peek') {
    if (!S.revealed) return handoff(nm(S.presIdx), 'רק הנשיא רואה את שלושת הקלפים הבאים', 'אני ' + esc(nm(S.presIdx)) + ' — להצצה');
    const top = S.deck.slice(0, 3);
    return '<div class="screen fade">' +
      topbar('🔮 הצצה במדיניות') +
      '<div class="card">' +
        '<h2 class="card-t">שלושת הקלפים העליונים, לפי הסדר</h2>' +
        '<div class="pol-row">' + top.map((c, i) => policyCard(c, null, i, ['הבא בתור', 'אחריו', 'שלישי'][i])).join('') + '</div>' +
      '</div>' +
      '<p class="hint" style="text-align:center">מותר לכם לשקר לגבי מה שראיתם.</p>' +
      '<div class="grow"></div>' +
      '<button class="btn btn-primary" data-act="powerDone">סיימתי — הסתר והמשך</button>' +
    '</div>';
  }

  if (k === 'investigate') {
    if (!S.revealed) return handoff(nm(S.presIdx), 'תוצאת החקירה של ' + esc(nm(S.powerTarget)) + ' — לעיניך בלבד', 'אני ' + esc(nm(S.presIdx)) + ' — לתוצאה');
    const t = P(S.powerTarget);
    const isFas = t.role !== 'liberal';
    return '<div class="screen fade">' +
      topbar('🔍 חקירת נאמנות') +
      '<div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:14px">' +
        '<div class="role-card ' + (isFas ? 'fas' : 'lib') + '">' +
          '<div class="r-lbl">השתייכות מפלגתית של</div>' +
          '<div class="r-name" style="font-size:1.5rem">' + esc(t.name) + '</div>' +
          '<div class="r-name">' + (isFas ? 'פשיסט' : 'ליברל') + '</div>' +
          '<div class="r-desc">זו המפלגה בלבד — היטלר נראה כאן כ"פשיסט", ואין לדעת מהכרטיס הזה אם זה הוא.</div>' +
        '</div>' +
        '<p class="hint" style="text-align:center">מותר לכם לשקר לגבי מה שראיתם.</p>' +
      '</div>' +
      '<button class="btn btn-primary" data-act="powerDone">סיימתי — הסתר והמשך</button>' +
    '</div>';
  }

  /* special / kill — הכרזה פומבית */
  const isKill = k === 'kill';
  return '<div class="screen fade">' +
    topbar(info.icon + ' ' + info.name) +
    '<div class="banner ' + (isKill ? 'fas' : 'neutral') + '">' +
      (isKill
        ? '💀 ' + esc(nm(S.powerTarget)) + ' הוצא להורג'
        : '🗳️ ' + esc(nm(S.powerTarget)) + ' יהיה הנשיא בסבב הבא') +
      '<div class="b-sub">' + (isKill
        ? 'השחקן יצא מהמשחק, אינו מצביע ואינו מכהן. אסור לו לחשוף את תפקידו.'
        : 'אחרי הסבב הזה הנשיאות חוזרת לסדר הרגיל.') + '</div>' +
    '</div>' +
    playersView() +
    '<div class="grow"></div>' +
    '<button class="btn btn-primary" data-act="powerDone">המשך לסבב הבא</button>' +
  '</div>';
}

function scrGameOver() {
  const libWin = S.winner === 'liberal';
  const roleName = r => r === 'liberal' ? 'ליברל' : (r === 'hitler' ? 'היטלר' : 'פשיסט');
  return '<div class="screen fade">' +
    topbar('סוף המשחק') +
    '<div class="banner ' + (libWin ? 'lib' : 'fas') + '" style="padding:26px 18px;font-size:1.5rem">' +
      (libWin ? '🕊️ הליברלים ניצחו' : '🔥 הפשיסטים ניצחו') +
      '<div class="b-sub" style="font-size:.9rem">' + S.winReason + '</div>' +
    '</div>' +
    boardView() +
    '<div class="card">' +
      '<h2 class="card-t">חשיפת התפקידים</h2>' +
      '<div class="sel-list">' + S.players.map(p =>
        '<div class="sel" style="pointer-events:none;' + (p.role === 'liberal' ? 'border-color:#1d3a6b' : 'border-color:#5c1b1b') + (p.alive ? '' : ';opacity:.55') + '">' +
          '<span>' + esc(p.name) + (p.alive ? '' : ' 💀') + '</span>' +
          '<span class="why" style="color:' + (p.role === 'liberal' ? '#93c5fd' : '#fca5a5') + ';font-weight:900">' + roleName(p.role) + '</span>' +
        '</div>').join('') +
      '</div>' +
    '</div>' +
    '<button class="btn btn-primary" data-act="again">משחק חדש עם אותם שחקנים</button>' +
    '<button class="btn btn-ghost" data-act="reset">חזרה למסך הפתיחה</button>' +
  '</div>';
}

/* ══════════════ גיליונות (יומן / חוקים) ══════════════ */

function sheetLog() {
  const items = S.log.map(l => '<div class="log-item"><span class="rnd">סבב ' + l.r + '</span>' + esc(l.text) + '</div>').join('');
  return '<div class="overlay" data-act="closeSheet"><div class="sheet" data-stop="1">' +
    '<h3>🗒️ יומן המשחק</h3>' +
    '<div class="log-list">' + (items || '<div class="log-item">עוד לא קרה כלום.</div>') + '</div>' +
    '<button class="btn btn-ghost" data-act="closeSheet">סגור</button>' +
  '</div></div>';
}

function sheetRules() {
  const n = S ? S.boardSize : (UI.names.length in POWERS ? UI.names.length : 7);
  const pw = POWERS[n] || POWERS[7];
  const pwRows = pw.map((k, i) => '<li>מדיניות פשיסטית ' + (i + 1) + ': ' + (k ? POWER_INFO[k].name : 'ללא כוח') + '</li>').join('');
  return '<div class="overlay" data-act="closeSheet"><div class="sheet" data-stop="1">' +
    '<h3>📖 חוקי המשחק</h3>' +
    '<div class="rules-h">המטרה</div>' +
    '<p class="rules-p"><b>ליברלים:</b> להעביר 5 מדיניות ליברליות, או להוציא את היטלר להורג.<br>' +
    '<b>פשיסטים:</b> להעביר 6 מדיניות פשיסטיות, או להכניס את היטלר לתפקיד קנצלר אחרי שהועברו 3 מדיניות פשיסטיות.</p>' +
    '<div class="rules-h">מהלך סבב</div>' +
    '<ul class="rules-ul">' +
      '<li>הנשיאות עוברת בסדר הישיבה. הנשיא מציע קנצלר.</li>' +
      '<li>כולם מצביעים כן/לא. רוב (יותר מחצי) מאשר; תיקו נחשב כישלון.</li>' +
      '<li>ממשלה שאושרה: הנשיא מושך 3 קלפים ומשליך אחד, הקנצלר מקבל 2 ומעביר אחד.</li>' +
      '<li>אסור להראות קלפים או לצטט אותם במדויק — מותר לשקר.</li>' +
      '<li>שלוש הצבעות כושלות ברצף = כאוס: הקלף העליון מועבר אוטומטית, וההגבלות על מועמדות מתאפסות.</li>' +
    '</ul>' +
    '<div class="rules-h">הגבלות מועמדות</div>' +
    '<p class="rules-p">מי שכיהן כנשיא או כקנצלר בממשלה האחרונה שאושרה אינו יכול להיות מועמד לקנצלרות. אם נותרו 5 שחקנים או פחות — רק הקנצלר האחרון חסום.</p>' +
    '<div class="rules-h">כוחות הנשיא בלוח של ' + n + ' שחקנים</div>' +
    '<ul class="rules-ul">' + pwRows + '<li>אחרי 5 מדיניות פשיסטיות נפתח גם הווטו.</li></ul>' +
    '<div class="rules-h">וטו</div>' +
    '<p class="rules-p">אחרי 5 מדיניות פשיסטיות הקנצלר יכול לבקש לבטל את שתי המדיניות. אם הנשיא מסכים — לא עוברת מדיניות ומד הבחירות הכושלות עולה באחד. אם מסרב — הקנצלר חייב להעביר אחת.</p>' +
    '<div class="rules-h">החפיסה</div>' +
    '<p class="rules-p">בחפיסה <bdi>17</bdi> קלפים: <bdi>6</bdi> ליברליים ו-<bdi>11</bdi> פשיסטיים. כשנשארים פחות מ-3 קלפים, ההשלכות מעורבבות בחזרה.</p>' +
    '<button class="btn btn-ghost" data-act="closeSheet" style="margin-top:16px">סגור</button>' +
  '</div></div>';
}

/* ══════════════ ראוטר ══════════════ */

const SCREENS = {
  setup: scrSetup, roles: scrRoles, nominate: scrNominate, vote: scrVote,
  voteResult: scrVoteResult, presDraw: scrPresDraw, chanDraw: scrChanDraw,
  vetoAsk: scrVetoAsk, enacted: scrEnacted, power: scrPower, gameover: scrGameOver,
};

function render() {
  const phase = S ? S.phase : 'setup';
  let html = (SCREENS[phase] || scrSetup)();
  if (UI.showSheet === 'log' && S) html += sheetLog();
  if (UI.showSheet === 'rules') html += sheetRules();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  if (S) save();
}

/* ══════════════ אירועים ══════════════ */

app.addEventListener('input', e => {
  const inp = e.target.closest('.name-inp');
  if (!inp) return;
  UI.names[+inp.dataset.i] = inp.value;
  const btn = app.querySelector('[data-act="start"]');
  if (btn) {
    const ok = UI.names.length >= 5 && UI.names.length <= 10 && UI.names.every(n => n.trim().length > 0);
    btn.disabled = !ok;
  }
});

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const i = el.dataset.i != null ? +el.dataset.i : null;

  /* אל תסגור את הגיליון בלחיצה בתוכו */
  if (act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;

  switch (act) {

    /* ── הגדרות ── */
    case 'addName':
      if (UI.names.length < 10) { UI.names.push(''); render(); }
      break;
    case 'delName':
      UI.names.splice(i, 1); render(); break;
    case 'shuffleNames':
      shuffle(UI.names); render(); break;
    case 'start': {
      const names = UI.names.map(n => n.trim()).filter(Boolean);
      if (names.length < 5 || names.length > 10) return;
      const seen = {};
      const unique = names.map(n => { seen[n] = (seen[n] || 0) + 1; return seen[n] > 1 ? n + ' ' + seen[n] : n; });
      LS.set(NAMES_KEY, JSON.stringify(unique));
      UI.names = unique.slice();
      newGame(unique);
      buzz(20);
      render();
      break;
    }
    case 'resume': {
      try { S = JSON.parse(LS.get(SAVE_KEY)); } catch (err) { S = null; }
      if (S) { S.revealed = false; S.pending = null; render(); }
      break;
    }
    case 'reset':
      if (!confirm('לחזור למסך הפתיחה? המשחק הנוכחי יימחק.')) return;
      clearSave(); S = null; render(); break;
    case 'again': {
      const names = S.players.map(p => p.name);
      newGame(names); buzz(20); render(); break;
    }

    /* ── מסך מסירה ── */
    case 'reveal':
      S.revealed = true; buzz(15); render(); break;

    /* ── תפקידים ── */
    case 'roleDone':
      S.roleIdx++;
      S.revealed = false;
      if (S.roleIdx >= S.players.length) {
        S.roleIdx = 0;
        S.presIdx = 0; S.regularIdx = 0;
        S.phase = 'nominate';
        log(nm(0) + ' פותח כנשיא הראשון');
      }
      render();
      break;

    /* ── מינוי והצבעה ── */
    case 'nominate': nominate(i); break;
    case 'vote': castVote(el.dataset.v === '1'); break;
    case 'afterVote': afterVote(); break;

    /* ── מליאה ── */
    case 'pickCard':
    case 'pickTarget':
      S.pending = (S.pending === i ? null : i); render(); break;
    case 'cancelPick':
      S.pending = null; render(); break;
    case 'presDiscard': {
      const kept = S.drawn.filter((_, idx) => idx !== i);
      S.discard.push(S.drawn[i]);
      S.chanCards = kept;
      S.drawn = [];
      S.pending = null;
      S.revealed = false;
      S.phase = 'chanDraw';
      render();
      break;
    }
    case 'chanEnact': {
      const chosen = S.chanCards[i];
      S.chanCards.forEach((c, idx) => { if (idx !== i) S.discard.push(c); });
      S.chanCards = [];
      S.pending = null;
      enact(chosen, false);
      break;
    }
    case 'vetoAsk':
      S.revealed = false; S.phase = 'vetoAsk'; render(); break;
    case 'vetoYes':
      S.chanCards.forEach(c => S.discard.push(c));
      S.chanCards = [];
      log('הופעל וטו על ידי ' + nm(S.presIdx) + ' ו-' + nm(S.chanIdx) + ' — לא הועברה מדיניות');
      S.tracker++;
      if (S.tracker >= 3) { chaos(); } else { S.round++; startRound(); }
      break;
    case 'vetoNo':
      S.vetoAsked = true;
      S.revealed = false;
      S.phase = 'chanDraw';
      log(nm(S.presIdx) + ' דחה את בקשת הווטו');
      render();
      break;

    /* ── כוחות ── */
    case 'afterEnacted': afterEnacted(); break;
    case 'power': usePower(i); break;
    case 'powerDone': finishPower(); break;

    /* ── גיליונות ── */
    case 'sheet': UI.showSheet = el.dataset.v; render(); break;
    case 'closeSheet': UI.showSheet = null; render(); break;
  }
});

/* מניעת סגירה בשוגג של המשחק */
window.addEventListener('beforeunload', e => {
  if (S && S.phase !== 'setup' && S.phase !== 'gameover') { e.preventDefault(); e.returnValue = ''; }
});

/* ══════════════ אתחול ══════════════ */

/* אם משהו נשבר — להראות הודעה במקום מסך ריק */
function fatal(msg) {
  app.innerHTML = '<div class="screen center"><div class="card">' +
    '<h2 class="card-t">משהו השתבש</h2>' +
    '<p class="hint">' + esc(msg) + '</p>' +
    '<p class="hint" style="margin-top:10px">נסו לרענן את הדף, או לפתוח אותו בדפדפן אחר.</p>' +
    '</div></div>';
}
window.addEventListener('error', e => { if (!app.innerHTML.trim()) fatal(e.message || 'שגיאה לא ידועה'); });

(function boot() {
  let saved = null;
  try { saved = JSON.parse(LS.get(NAMES_KEY)); } catch (e) {}
  UI.names = Array.isArray(saved) && saved.length >= 5 ? saved.slice(0, 10) : ['', '', '', '', ''];
  try { render(); } catch (e) { fatal(e.message); }
})();
</script>
</body>
</html>
